              /** 카톡 등에서 '공유'로 출고 캡처를 보냈을 때 */
              private fun handleShare(i: Intent?): Boolean {
                  if (i == null) return false
                  val uris = ArrayList<Uri>()
                  try {
                      if (i.action == Intent.ACTION_SEND) {
                          val u: Uri? = i.getParcelableExtra(Intent.EXTRA_STREAM)
                          if (u != null) uris.add(u)
                      } else if (i.action == Intent.ACTION_SEND_MULTIPLE) {
                          val l: ArrayList<Uri>? = i.getParcelableArrayListExtra(Intent.EXTRA_STREAM)
                          if (l != null) uris.addAll(l)
                      }
                  } catch (e: Exception) { }
                  if (uris.isEmpty()) return false
                  i.action = null
                  AlertDialog.Builder(this).setTitle("이 이미지를 어디에 쓸까요?")
                      .setItems(arrayOf("출고 목록 (피킹)", "재고 목록 불러오기 (B/L·입고일)")) { _, w ->
                          readImages(uris, if (w == 0) "out" else "ref")
                      }
                      .setOnCancelListener { if (screen == "home") showHome() }
                      .show()
                  if (screen != "home") return true
                  showHome()
                  return true
              }


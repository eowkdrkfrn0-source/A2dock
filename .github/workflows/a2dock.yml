                  content.addView(row(
                      btn("B/L 입력" + if (noBl > 0) " ($noBl)" else "", Color.rgb(90, 60, 160)) { blSel.clear(); showBl() },
                      btn("재고 목록·대조 (${refs.size})", GREY) { showRef() }
                  ))
                  content.addView(btn("엑셀 내보내기", Color.rgb(30, 110, 70)) { exportXlsx() })
                  val fbTxt = when {
                      !Fb.enabled -> "공유 꺼짐 (Firebase 설정 안 됨) · 이 폰에만 저장"
                      syncErr.isNotEmpty() -> "⚠ 공유 실패: $syncErr (자동으로 다시 시도)"
                      !fetchedOnce -> "공유: 받아오는 중…"
                      else -> "공유 연결됨 ✓ ${userName()}" + if (syncAt.isNotEmpty()) " · 마지막 전송 $syncAt" else ""
                  }
                  content.addView(label(fbTxt, 12f, if (syncErr.isNotEmpty()) RED else GREEN).apply { gravity = Gravity.CENTER })
                  tabPage(content)
              }

              // ======================= 입고: 라벨 찍기 =======================
              private fun batchItems() = items.filter { it.batch == curBatch && curBatch.isNotEmpty() }
              private fun queue() = batchItems().filter { it.loc.isEmpty() }.sortedBy { it.seq }

              private fun ensureBatch() {
                  if (curBatch.isNotEmpty()) return
                  val d = today()
                  val p = getSharedPreferences("rack", MODE_PRIVATE)
                  val n = p.getInt("bc_$d", 0) + 1
                  p.edit().putInt("bc_$d", n).apply()
                  curBatch = "${shortDate(d)} ${circled(n)} ${userName()}".trim()
                  batchDate = d
                  batchSeq = 0
                  lastPlacedLoc = ""
                  save()
              }

              private fun startScan(mode: String) {
                  scanMode = mode
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) showScan(mode)
                  else camPerm.launch(Manifest.permission.CAMERA)
              }

              private fun showScan(mode: String) {
                  screen = "scan"; scanMode = mode
                  if (mode == "in") ensureBatch()
                  val root = vroot()
                  root.addView(topBar(if (mode == "in") "입고 · 라벨 찍기" else "이동할 것 찍기",
                      if (mode == "in") curBatch else "${moveSel.size}개", if (mode == "in") TEAL else PURPLE))

                  val camBox = FrameLayout(this).apply { background = round(Color.BLACK, 16); clipToOutline = true }
                  val pv = PreviewView(this).apply { implementationMode = PreviewView.ImplementationMode.COMPATIBLE }
                  camBox.addView(pv, FrameLayout.LayoutParams(-1, -1))
                  val ov = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      background = round(Color.argb(235, 16, 16, 20), 14, BLUE)
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                  }
                  val num = TextView(this).apply {
                      text = "–"; gravity = Gravity.CENTER; setTextColor(Color.WHITE); textSize = 34f; setTypeface(typeface, Typeface.BOLD)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(BLUE) }
                  }
                  ov.addView(num, LinearLayout.LayoutParams(dp(70), dp(70)))
                  val ovText = vbox().apply { setPadding(dp(12), 0, 0, 0) }
                  val msg = label(if (mode == "in") "라벨(QR·바코드·글자)을 비추세요" else "옮길 롤의 라벨을 비추세요", 13f, SUB)
                  val nm = label("", 17f, Color.WHITE, true)
                  ovText.addView(msg); ovText.addView(nm)
                  ov.addView(ovText, LinearLayout.LayoutParams(0, -2, 1f))
                  camBox.addView(ov, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM).apply { setMargins(dp(8), dp(8), dp(8), dp(8)) })
                  ovNum = num; ovMsg = msg; ovName = nm
                  root.addView(camBox, LinearLayout.LayoutParams(-1, dp(300)))

                  root.addView(row(
                      btn("🔦") { torch = !torch; camera?.cameraControl?.enableTorch(torch) }.apply { textSize = 14f },
                      btn("번호로 찾기", Color.rgb(45, 70, 110)) { findByNumber() }.apply { textSize = 15f },
                      btn("B/L로 찾기", Color.rgb(90, 60, 160)) { findByNumber(byBl = true) }.apply { textSize = 15f },
                      weights = floatArrayOf(0.55f, 1.2f, 1.2f)
                  ))
                  root.addView(row(
                      btn("글자 고르기") { pickFromText() }.apply { textSize = 14f; minHeight = dp(44) },
                      btn("직접 입력") { manualAdd() }.apply { textSize = 14f; minHeight = dp(44) }
                  ))
                  if (mode == "in") {
                      root.addView(TextView(this).apply {
                          text = "입고일 $batchDate  (눌러서 변경) · 목록에 있는 LOT는 B/L·입고일 자동"
                          textSize = 12f; setTextColor(Color.rgb(243, 201, 138)); setPadding(0, dp(4), 0, dp(4))
                          setOnClickListener { dateDialog(batchDate) { d -> batchDate = d; queue().forEach { if (refs[it.lot]?.inDate.isNullOrBlank()) it.inDate = d }; save(); showScan("in") } }
                      })
                  }
                  val list = vbox()
                  scanList = list
                  root.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  if (mode == "in") root.addView(big(btn("적치 시작 ▶", TEAL) { stopCamera(); showPlace() }))
                  else root.addView(big(btn("다 찍었어요 ▶", PURPLE) { stopCamera(); showMove() }))
                  setContentView(root)
                  fillScanList()
                  val last = if (mode == "in") queue().lastOrNull() else null
                  if (last != null) showOverlay(last.seq, last.name.ifBlank { last.lot }, "마지막: ${last.lot}", mkColor(last.mk))
                  startCamera(pv)
              }

              private fun showOverlay(n: Int, name: String, msg: String, color: Int) {
                  ovNum?.text = if (n > 0) "$n" else "✓"
                  (ovNum?.background as? GradientDrawable)?.setColor(color)
                  ovName?.text = name
                  ovMsg?.text = msg
              }

              private fun itemRow(it: RItem, right: String = "", rightColor: Int = SUB, bg: Int = CARD, stroke: Int? = null, n: Int = it.seq, onClick: (() -> Unit)? = null): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      background = round(bg, 12, stroke); setPadding(dp(10), dp(8), dp(10), dp(8))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, dp(3), 0, dp(3)) }
                      if (n > 0) addView(numBadge(n, mkColor(it.mk), 40))
                      val t = vbox().apply { setPadding(dp(10), 0, 0, 0) }
                      t.addView(label(it.name.ifBlank { it.lot } + (if (it.qty.isNotBlank()) " · ${it.qty}" else ""), 16f, Color.WHITE, true))
                      val sub = listOf(it.mk, it.lot, it.size).filter { s -> s.isNotBlank() }.joinToString(" · ")
                      t.addView(label(sub + (if (it.bl.isNotBlank()) "\nB/L ${it.bl}" else ""), 12f, SUB))
                      addView(t, LinearLayout.LayoutParams(0, -2, 1f))
                      if (right.isNotEmpty()) addView(label(right, 13f, rightColor, true))
                      if (onClick != null) setOnClickListener { onClick() }
                  }

              private fun fillScanList() {
                  val list = scanList ?: return
                  list.removeAllViews()
                  if (scanMode == "in") {
                      val q = queue()
                      list.addView(label("대기열 (찍은 순서) · ${q.size}개", 13f, SUB))
                      for (it in q) list.addView(itemRow(it, "✕", DIM) { ask("대기열에서 빼기", "${it.seq}번 ${it.lot}", "빼기") { val id = it.id; items.removeAll { x -> x.id == id }; save(); fillScanList() } })
                  } else {
                      val sel = items.filter { it.id in moveSel }
                      list.addView(label("옮길 것 · ${sel.size}개", 13f, SUB))
                      for (it in sel) list.addView(itemRow(it, it.loc, GREEN, n = 0))
                  }
              }

              private fun startCamera(pv: PreviewView) {
                  candKey = ""; candHits = 0
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val p = future.get()
                          provider = p
                          val preview = Preview.Builder().build().also { it.setSurfaceProvider(pv.surfaceProvider) }
                          val rs = ResolutionSelector.Builder()
                              .setResolutionStrategy(ResolutionStrategy(Size(1920, 1080), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER))
                              .build()
                          val an = ImageAnalysis.Builder().setResolutionSelector(rs)
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST).build()
                          an.setAnalyzer(exec) { proxy -> analyze(proxy) }
                          p.unbindAll()
                          camera = p.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, an)
                          torch = false
                          scanning = true
                      } catch (e: Exception) { toast("카메라 시작 실패: ${e.message}") }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun stopCamera() {
                  scanning = false
                  try { provider?.unbindAll() } catch (e: Exception) { }
                  camera = null
              }

              @androidx.annotation.OptIn(ExperimentalGetImage::class)
              private fun analyze(proxy: ImageProxy) {
                  val media = proxy.image
                  if (media == null || !scanning) { proxy.close(); return }
                  val img = InputImage.fromMediaImage(media, proxy.imageInfo.rotationDegrees)
                  barRec.process(img).addOnCompleteListener { bt ->
                      var found: Parsed? = null
                      if (bt.isSuccessful) {
                          for (b in bt.result) {
                              val raw = b.rawValue ?: continue
                              found = Labels.fromBarcode(raw)
                              if (found != null) break
                          }
                      }
                      val f = found
                      if (f != null) {
                          proxy.close()
                          onParsed(f, true)
                      } else {
                          textRec.process(img)
                              .addOnSuccessListener { t ->
                                  lastText = t.text
                                  Labels.fromText(t.text)?.let { onParsed(it, false) }
                              }
                              .addOnCompleteListener { proxy.close() }
                      }
                  }
              }

              private fun onParsed(p: Parsed, sure: Boolean) {
                  if (!scanning || screen != "scan") return
                  val k = p.key()
                  if (!sure) {
                      if (k == candKey) candHits++ else { candKey = k; candHits = 1 }
                      if (candHits < 2) return
                  }
                  val now = System.currentTimeMillis()
                  if (k == lastAddKey && now - lastAddAt < 3000) return
                  lastAddKey = k; lastAddAt = now
                  if (scanMode == "move") addMove(p) else addInbound(p)
              }

              private fun addInbound(p: Parsed) {
                  val k = p.key()
                  batchItems().firstOrNull { it.key() == k }?.let {
                      showOverlay(it.seq, it.name.ifBlank { it.lot }, "이미 찍었어요 (${it.seq}번)", GREY); buzz(30); return
                  }
                  items.firstOrNull { it.key() == k && it.loc.isNotEmpty() }?.let {
                      showOverlay(0, it.lot, "이미 재고에 있어요 · ${it.loc}", RED); buzz(300); return
                  }
                  val ref = refs[p.lot]
                  batchSeq++
                  val it = RItem(
                      System.currentTimeMillis() * 10 + (batchSeq % 10), p.mk, p.lot,
                      ref?.name?.takeIf { s -> s.isNotBlank() } ?: p.name,
                      ref?.qty?.takeIf { s -> s.isNotBlank() } ?: p.qty,
                      p.size, ref?.bl ?: "", ref?.inDate?.takeIf { s -> s.isNotBlank() } ?: batchDate,
                      "", curBatch, batchSeq
                  )
                  items.add(it)
                  save()
                  buzz(120)
                  showOverlay(it.seq, it.name.ifBlank { it.lot }, "파레트에 ${it.seq} 쓰세요 · ${it.lot}", mkColor(it.mk))
                  fillScanList()
              }

              private fun addMove(p: Parsed) {
                  val k = p.key()
                  val it = items.firstOrNull { x -> x.loc.isNotEmpty() && x.key() == k } ?: items.firstOrNull { x -> x.loc.isNotEmpty() && x.lot == p.lot }
                  if (it == null) { showOverlay(0, p.lot, "재고에 없어요", RED); buzz(300); return }
                  if (!moveSel.add(it.id)) { showOverlay(0, it.lot, "이미 골랐어요", GREY); return }
                  buzz(120)
                  showOverlay(moveSel.size, it.name.ifBlank { it.lot }, "지금 ${it.loc} · ${it.lot}", PURPLE)
                  fillScanList()
              }

              /** 자동으로 못 읽을 때: 화면에 읽힌 글자 중에서 LOT 고르기 */
              private fun pickFromText() {
                  val toks = lastText.split(' ', '\n', '\t', ':').map { it.trim().trim(',', '.', ';') }
                      .filter { it.length >= 4 && it.any { c -> c.isDigit() } }.distinct().take(60)
                  if (toks.isEmpty()) { toast("읽힌 글자가 없어요. 라벨을 비춘 채로 다시 눌러주세요"); return }
                  AlertDialog.Builder(this).setTitle("LOT로 쓸 글자를 누르세요")
                      .setItems(toks.toTypedArray()) { _, w -> manualAdd(toks[w].uppercase()) }
                      .setNegativeButton("취소", null).show()
              }

              private fun mkOf(lot: String): String = when {
                  lot.startsWith("PL") -> "Semperflex"
                  lot.startsWith("XS") -> "Hengtong"
                  lot.startsWith("S1") -> "Gates"
                  Regex("\\d{10}-\\d{3}").matches(lot) -> "Polyhose"
                  else -> "기타"
              }

              /** 라벨이 안 읽힐 때: LOT 일부(뒤 4자리 등)로 재고 목록·재고에서 찾기 */
              private fun findByNumber(byBl: Boolean = false) {
                  val wasScanning = scanning
                  scanning = false   // 카메라 인식 잠시 멈춤 (입력·목록이 바로 뜨게)
                  val move = scanMode == "move"
                  val e = field(if (byBl) "B/L 숫자 (예: 뒤 4자리)" else "LOT 숫자 (예: 뒤 4자리)", "").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      imeOptions = android.view.inputmethod.EditorInfo.IME_ACTION_DONE
                  }
                  val info = label("2자리 이상 누르면 바로 아래에 떠요", 13f, SUB)
                  var abc = false
                  val toggle = Button(this).apply {
                      text = "ABC 키보드"; textSize = 13f; isAllCaps = false; setTextColor(Color.WHITE)
                      background = round(GREY, 10); stateListAnimator = null; minHeight = dp(40); minimumHeight = dp(40)
                  }
                  val list = vbox()
                  val box = vbox().apply {
                      setPadding(dp(16), dp(8), dp(16), 0)
                      addView(e)
                      addView(row(info, toggle, weights = floatArrayOf(1.4f, 1f)))
                      addView(ScrollView(this@RackActivity).apply { addView(list) }, LinearLayout.LayoutParams(-1, dp(330)))
                  }
                  lateinit var dlg: AlertDialog
                  var selBl = ""
                  var first: (() -> Unit)? = null
                  var hitCount = 0

                  fun item(top: String, sub: String, color: Int, keep: Boolean = false, onPick: () -> Unit) {
                      list.addView(vbox().apply {
                          background = round(CARD, 10); setPadding(dp(12), dp(8), dp(12), dp(8))
                          addView(label(top, 17f, color, true))
                          if (sub.isNotBlank()) addView(label(sub, 12f, SUB).apply { maxLines = 1 })
                          isClickable = true
                          setOnClickListener { if (!keep) dlg.dismiss(); onPick() }
                      }, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, dp(3), 0, dp(3)) })
                  }

                  lateinit var drawRef: () -> Unit
                  fun blDraw(q: String) {
                      val placed = stock().map { it.lot }.toHashSet()
                      val inBatch = batchItems().map { it.lot }.toHashSet()
                      // 이동: 재고에서 / 입고: 사무실 목록에서
                      val pool: List<Triple<String, String, String>> =   // bl, lot, 설명
                          if (move) stock().map { Triple(it.bl.uppercase(), it.lot, "📍${it.loc} · ${it.name}") }
                          else refs.values.map { Triple(it.bl.uppercase(), it.lot, "${it.name} · ${shortDate(it.inDate)}") }
                      if (selBl.isEmpty()) {
                          val groups = pool.filter { it.first.isNotBlank() && it.first.contains(q) }.groupBy { it.first }.toSortedMap()
                          hitCount = 0
                          info.text = when {
                              !move && refs.isEmpty() -> "재고 목록이 비어 있어요"
                              groups.isEmpty() -> "'$q' 들어간 B/L 없음"
                              else -> "B/L ${groups.size}개 · 눌러서 열기"
                          }
                          for ((bl, rows) in groups) {
                              val left = if (move) rows.size else rows.count { it.second !in placed && it.second !in inBatch }
                              item("📦 $bl", if (move) "재고 ${rows.size}개" else "목록 ${rows.size}개 · 안 찍은 것 ${left}개", Color.WHITE, keep = true) { selBl = bl; drawRef() }
                          }
                          if (groups.size == 1) { selBl = groups.firstKey(); drawRef() }
                          return
                      }
                      val rows = pool.filter { it.first == selBl }.sortedBy { it.second }
                      item("← B/L 다시 고르기", selBl, Color.rgb(120, 190, 255), keep = true) { selBl = ""; drawRef() }
                      fun add(lot: String) {
                          lastAddKey = ""
                          if (move) { stock().firstOrNull { it.lot == lot }?.let { h -> addMove(Parsed(h.mk, h.lot, h.name, h.qty, h.size)) } }
                          else { val r = refs[lot] ?: return; addInbound(Parsed(mkOf(r.lot), r.lot, r.name, r.qty)) }
                      }
                      val todo = if (move) rows.filter { r -> moveSel.none { id -> items.firstOrNull { it.id == id }?.lot == r.second } }
                                 else rows.filter { it.second !in placed && it.second !in inBatch }
                      info.text = "$selBl · ${rows.size}개 · 남은 ${todo.size}개"
                      if (todo.size > 1) item("⤓ 남은 ${todo.size}개 전부 넣기", "", GREEN) { todo.forEach { add(it.second) } }
                      for (r in rows) {
                          val done = r.second !in todo.map { it.second }
                          val tag = if (!done) "" else if (move) "  [선택됨]" else if (r.second in inBatch) "  [이미 찍음]" else "  [재고에 있음]"
                          item(r.second + tag, r.third, if (done) DIM else Color.WHITE, keep = done || move || mkOf(r.second) != "Hengtong") {
                              if (done) return@item
                              if (!move && mkOf(r.second) == "Hengtong") { val rf = refs[r.second] ?: return@item; textDialog("사이즈 (소재 사양)", "Ø", false) { sz -> lastAddKey = ""; addInbound(Parsed("Hengtong", rf.lot, rf.name, rf.qty, sz)) } }
                              else { add(r.second); drawRef() }
                          }
                      }
                  }

                  fun draw() {
                      list.removeAllViews(); first = null; hitCount = 0
                      val q = e.text.toString().trim().uppercase().replace(" ", "")
                      if (q.length < 2) { selBl = ""; info.text = "2자리 이상 누르면 바로 아래에 떠요"; return }
                      if (byBl) { blDraw(q); return }
                      if (move) {
                          val hits = stock().filter { it.lot.uppercase().contains(q) }.sortedBy { locSortKey(it.loc) }
                          hitCount = hits.size
                          info.text = if (hits.isEmpty()) "재고에 '$q' 없음" else "${hits.size}개 · 눌러서 선택"
                          for (h in hits.take(60)) {
                              val act = { lastAddKey = ""; addMove(Parsed(h.mk, h.lot, h.name, h.qty, h.size)) }
                              if (first == null) first = act
                              item(h.lot, "📍${h.loc} · ${h.name}", Color.WHITE, act)
                          }
                      } else {
                          val placed = stock().map { it.lot }.toHashSet()
                          val inBatch = batchItems().map { it.lot }.toHashSet()
                          val hits = refs.values.filter { it.lot.uppercase().contains(q) }
                              .sortedWith(compareBy<RRef>({ it.lot in placed || it.lot in inBatch }, { it.lot }))
                          hitCount = hits.size
                          info.text = when {
                              refs.isEmpty() -> "재고 목록이 비어 있어요"
                              hits.isEmpty() -> "목록에 '$q' 없음"
                              else -> "${hits.size}개 · 눌러서 선택"
                          }
                          for (r in hits.take(60)) {
                              val done = r.lot in inBatch || r.lot in placed
                              val tag = if (r.lot in inBatch) "  [이미 찍음]" else if (r.lot in placed) "  [재고에 있음]" else ""
                              val act = {
                                  val mk = mkOf(r.lot)
                                  lastAddKey = ""
                                  if (mk == "Hengtong") textDialog("사이즈 (소재 사양)", "Ø", false) { sz -> lastAddKey = ""; addInbound(Parsed(mk, r.lot, r.name, r.qty, sz)) }
                                  else addInbound(Parsed(mk, r.lot, r.name, r.qty))
                              }
                              if (first == null) first = act
                              item(r.lot + tag, "${r.name} · ${shortDate(r.inDate)} · ${r.bl}", if (done) DIM else Color.WHITE, act)
                          }
                      }
                      item("✎ 직접 입력 ($q)", "", GREEN) { manualAdd(q) }
                  }

                  drawRef = { draw() }
                  toggle.setOnClickListener {
                      abc = !abc
                      e.inputType = if (abc) InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS else InputType.TYPE_CLASS_NUMBER
                      toggle.text = if (abc) "123 키보드" else "ABC 키보드"
                      e.setSelection(e.text.length)
                      (getSystemService(Context.INPUT_METHOD_SERVICE) as? android.view.inputmethod.InputMethodManager)?.restartInput(e)
                  }
                  e.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: android.text.Editable?) { selBl = ""; draw() }
                  })
                  // 완료 키: 결과가 하나면 바로 선택
                  e.setOnEditorActionListener { _, _, _ ->
                      val f = first
                      if (hitCount == 1 && f != null) { dlg.dismiss(); f() }
                      true
                  }
                  dlg = AlertDialog.Builder(this).setTitle(if (byBl) "B/L로 찾기" else "번호로 찾기").setView(box)
                      .setNegativeButton("닫기", null).create()
                  dlg.setOnDismissListener { if (screen == "scan" && wasScanning) scanning = true }
                  dlg.window?.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE or WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)
                  dlg.show()
                  e.requestFocus()
                  e.post {
                      (getSystemService(Context.INPUT_METHOD_SERVICE) as? android.view.inputmethod.InputMethodManager)?.showSoftInput(e, 0)
                  }
              }

              private fun manualAdd(lot0: String = "") {
                  val box = vbox().apply { setPadding(dp(20), dp(8), dp(20), 0) }
                  val eLot = field("LOT (필수)", lot0)
                  val eName = field("품명 (선택)", "")
                  val eQty = field("수량/미터 (선택)", "")
                  val eSize = field("사이즈 (Hengtong 등, 선택)", "")
                  box.addView(eLot); box.addView(eName); box.addView(eQty); box.addView(eSize)
                  AlertDialog.Builder(this).setTitle(if (scanMode == "move") "이동할 LOT" else "직접 입력").setView(box)
                      .setPositiveButton("추가") { _, _ ->
                          val lot = eLot.text.toString().trim().uppercase()
                          if (lot.isEmpty()) { toast("LOT를 입력하세요"); return@setPositiveButton }
                          val p = Parsed(mkOf(lot), lot, eName.text.toString().trim(), eQty.text.toString().trim(), eSize.text.toString().trim())
                          lastAddKey = ""
                          if (scanMode == "move") addMove(p) else addInbound(p)
                      }
                      .setNegativeButton("취소", null).show()
              }

              // ======================= 적치 =======================
              private fun showPlace() {
                  screen = "place"
                  stopCamera()
                  val q = queue()
                  if (curBatch.isEmpty()) { showHome(); return }
                  val cur = q.firstOrNull { it.id == curId } ?: q.firstOrNull()
                  curId = cur?.id ?: 0L
                  val content = vbox()
                  if (cur == null) {
                      val c = card(Color.rgb(20, 50, 40), GREEN)
                      c.addView(label("대기열을 다 적치했어요 👍", 19f, Color.WHITE, true))
                      c.addView(label("아래 [입고 완료]를 누르고 B/L을 입력하세요", 14f, SUB))
                      content.addView(c)
                  } else {
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          background = round(CARD, 16, BLUE); setPadding(dp(14), dp(12), dp(14), dp(12))
                      }
                      c.addView(numBadge(cur.seq, mkColor(cur.mk), 84))
                      val t = vbox().apply { setPadding(dp(14), 0, 0, 0) }
                      t.addView(label("지금 올리는 파레트", 13f, SUB))
                      t.addView(label(cur.name.ifBlank { cur.mk }, 21f, Color.WHITE, true))
                      t.addView(label(listOf(cur.lot, cur.size, cur.qty).filter { it.isNotBlank() }.joinToString(" · "), 13f, SUB))
                      c.addView(t, LinearLayout.LayoutParams(0, -2, 1f))
                      content.addView(c)
                      content.addView(TextView(this).apply {
                          text = "입고일 ${cur.inDate} · 눌러서 변경"; textSize = 13f; setTextColor(Color.rgb(243, 201, 138)); setPadding(dp(4), dp(6), 0, dp(2))
                          setOnClickListener { dateDialog(cur.inDate) { d -> cur.inDate = d; save(); showPlace() } }
                      })
                      val info = label("", 13f, SUB).apply { gravity = Gravity.CENTER }
                      fun upd() { val n = at(pickLoc()).size; info.text = "${pickLoc()} 현재 ${n}개" }
                      content.addView(locPicker({ showPlace() }, { upd() }))
                      upd()
                      content.addView(info)
                      val nextN = q.indexOf(cur).let { i -> q.getOrNull(i + 1) }
                      content.addView(big(btn("저장 · ${pickLoc()}" + if (nextN != null) "  → 다음 ${nextN.seq}" else "", TEAL) {
                          place(cur, pickLoc())
                      }, 64, 18f))
                      if (lastPlacedLoc.isNotEmpty()) {
                          content.addView(big(btn("${cur.seq}도 같은 칸 ($lastPlacedLoc)", Color.rgb(45, 70, 110)) {
                              place(cur, lastPlacedLoc)
                          }, 58, 17f))
                      }
                      if (q.size > 1) content.addView(btn("남은 ${q.size}개 전부 ${pickLoc()}에", GREY) {
                          ask("한 번에 적치", "남은 ${q.size}개를 전부 ${pickLoc()}에 넣을까요?", "넣기") {
                              val loc = pickLoc()
                              for (x in q) placeSilent(x, loc)
                              lastPlacedLoc = loc; save(); buzz(150); showPlace()
                          }
                      })
                      content.addView(label("대기열 (눌러서 순서 바꾸기)", 13f, SUB).apply { setPadding(0, dp(10), 0, 0) })
                      for (x in q) {
                          val on = x.id == cur.id
                          content.addView(itemRow(x, if (on) "지금" else "", Color.WHITE, if (on) Color.rgb(30, 45, 80) else CARD, if (on) BLUE else null) {
                              curId = x.id; showPlace()
                          })
                      }
                  }
                  val placed = batchItems().filter { it.loc.isNotEmpty() }.sortedByDescending { it.seq }
                  if (placed.isNotEmpty()) {
                      content.addView(label("적치 완료 ${placed.size}개 (눌러서 취소)", 13f, SUB).apply { setPadding(0, dp(10), 0, 0) })
                      for (x in placed) content.addView(itemRow(x, x.loc, GREEN, Color.rgb(24, 27, 33)) {
                          ask("적치 취소", "${x.seq}번 ${x.lot} (${x.loc})를 대기열로 돌릴까요?", "돌리기") { x.loc = ""; save(); showPlace() }
                      })
                  }
                  val bottom = vbox().apply { setPadding(0, dp(6), 0, 0) }
                  bottom.addView(row(
                      btn("라벨 더 찍기") { startScan("in") },
                      big(btn("입고 완료", PURPLE) { finishBatch() }, 56, 18f),
                      weights = floatArrayOf(1f, 1.6f)
                  ))
                  page(topBar("적치", "${placed.size} / ${batchItems().size}", BLUE), content, bottom)
              }

              private fun placeSilent(it: RItem, loc: String) {
                  it.loc = loc
                  log("입고", it)
              }

              private fun place(it: RItem, loc: String) {
                  placeSilent(it, loc)
                  lastPlacedLoc = loc
                  setPickFrom(loc)
                  getSharedPreferences("rack", MODE_PRIVATE).edit().putString("lastLoc", loc).apply()
                  save(); buzz(120)
                  curId = 0L
                  toast("${it.seq}번 → $loc")
                  showPlace()
              }

              /** [입고 완료] → B/L 입력 */
              private fun finishBatch() {
                  if (curBatch.isEmpty()) { showHome(); return }
                  val q = queue()
                  if (q.isNotEmpty()) {
                      AlertDialog.Builder(this).setTitle("적치 안 한 게 ${q.size}개 있어요")
                          .setMessage(q.joinToString("\n") { "${it.seq}번 ${it.lot}" } + "\n\n이것들은 지우고 입고를 끝낼까요?")
                          .setPositiveButton("지우고 완료") { _, _ -> items.removeAll(q); save(); askBatchBl() }
                          .setNegativeButton("계속 적치", null).show()
                      return
                  }
                  askBatchBl()
              }

              private fun askBatchBl() {
                  val placed = batchItems()
                  if (placed.isEmpty()) { closeBatch(); return }
                  val common = placed.map { it.bl }.filter { it.isNotBlank() }.distinct()
                  val box = vbox().apply { setPadding(dp(20), dp(6), dp(20), 0) }
                  val locs = placed.groupBy { it.loc }.entries.sortedBy { locSortKey(it.key) }
                      .joinToString(", ") { if (it.value.size > 1) "${it.key}×${it.value.size}" else it.key }
                  box.addView(label("${placed.size}개 적치됨 · $locs", 13f, Color.DKGRAY))
                  val e = EditText(this).apply {
                      hint = "B/L 번호"; textSize = 20f; setText(if (common.size == 1) common[0] else "")
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS
                  }
                  box.addView(e)
                  if (recentBl.isNotEmpty()) {
                      box.addView(label("최근 B/L (누르면 입력)", 12f, Color.GRAY))
                      val chips = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (b in recentBl.take(8)) chips.addView(Button(this).apply {
                          text = b; isAllCaps = false; textSize = 13f
                          setOnClickListener { e.setText(b) }
                      })
                      box.addView(HorizontalScrollView(this).apply { addView(chips) })
                  }
                  val already = placed.count { it.bl.isNotBlank() }
                  if (already > 0) box.addView(label("※ 이미 B/L이 있는 ${already}개(목록에서 자동)는 그대로 두고, 없는 것에만 넣어요", 12f, Color.GRAY))
                  AlertDialog.Builder(this).setTitle("입고 완료 · $curBatch").setView(box).setCancelable(false)
                      .setPositiveButton("B/L 저장") { _, _ ->
                          val bl = e.text.toString().trim().uppercase()
                          if (bl.isNotEmpty()) {
                              var n = 0
                              for (x in placed) if (x.bl.isBlank()) { x.bl = bl; n++ }
                              addRecent(bl)
                              toast("B/L $bl · ${n}개에 저장")
                          }
                          closeBatch()
                      }
                      .setNeutralButton("나중에") { _, _ -> closeBatch() }
                      .setNegativeButton("취소", null).show()
              }

              private fun closeBatch() {
                  val b = curBatch
                  curBatch = ""; batchSeq = 0; lastPlacedLoc = ""; curId = 0L
                  save()
                  toast("입고 $b 완료")
                  showHome()
              }

              private fun addRecent(bl: String) {
                  recentBl.remove(bl); recentBl.add(0, bl)
                  while (recentBl.size > 15) recentBl.removeAt(recentBl.size - 1)
                  save()
              }

              // ======================= 총재고 =======================
              private fun showStock() {
                  screen = "stock"
                  val st = stock()
                  val content = vbox()
                  val seg = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; background = round(CARD, 12); setPadding(dp(4), dp(4), dp(4), dp(4)) }
                  for ((z, name) in listOf("A" to "A랙", "B" to "B랙", "F" to "평치")) {
                      val n = if (z == "F") st.count { it.loc == "평치" } else st.count { it.loc.startsWith(z) }
                      val on = stockZone == z
                      seg.addView(Button(this).apply {
                          text = "$name · $n"; textSize = 16f; isAllCaps = false; setTypeface(typeface, Typeface.BOLD)
                          setTextColor(if (on) Color.WHITE else SUB); stateListAnimator = null
                          background = round(if (on) BLUE else CARD, 9)
                          setOnClickListener { stockZone = z; stockRack = 0; showStock() }
                      }, LinearLayout.LayoutParams(0, dp(48), 1f).apply { setMargins(dp(2), 0, dp(2), 0) })
                  }
                  content.addView(seg)
                  val search = field("🔍 LOT · 품명 · B/L 검색", stockQuery).apply { textSize = 15f }
                  content.addView(search)
                  search.setOnEditorActionListener { _, _, _ -> stockQuery = search.text.toString().trim(); showStock(); true }
                  content.addView(btn("검색", GREY) { stockQuery = search.text.toString().trim(); showStock() }.apply { minHeight = dp(42) })

                  if (stockQuery.isNotEmpty()) {
                      val q = stockQuery.uppercase()
                      val res = st.filter { it.lot.uppercase().contains(q) || it.name.uppercase().contains(q) || it.bl.uppercase().contains(q) }
                          .sortedBy { locSortKey(it.loc) }
                      content.addView(label("검색 결과 ${res.size}개", 14f, SUB, true))
                      for (it in res) content.addView(itemRow(it, it.loc, GREEN, n = 0) { itemMenu(it) })
                      content.addView(btn("검색 지우기") { stockQuery = ""; showStock() })
                  } else if (stockZone == "F") {
                      val f = st.filter { it.loc == "평치" }.sortedBy { it.inDate }
                      content.addView(label("평치 ${f.size}개", 15f, Color.WHITE, true))
                      for (it in f) content.addView(itemRow(it, shortDate(it.inDate), Color.rgb(243, 201, 138), n = 0) { itemMenu(it) })
                  } else {
                      val max = maxRack(stockZone)
                      var r: LinearLayout? = null
                      val min = minRack(stockZone)
                      for (i in min..max) {
                          if ((i - min) % 5 == 0) { r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }; content.addView(r) }
                          val n = st.count { it.loc.startsWith("$stockZone$i-") }
                          val sel = stockRack == i
                          val bg = when {
                              sel -> BLUE
                              n == 0 -> Color.rgb(26, 29, 36)
                              else -> Color.argb(minOf(60 + n * 25, 200), 16, 170, 150)
                          }
                          r?.addView(TextView(this).apply {
                              text = "$stockZone$i\n${if (n == 0) "-" else "$n"}"; gravity = Gravity.CENTER; textSize = 13f
                              setTextColor(if (n == 0 && !sel) DIM else Color.WHITE); setTypeface(typeface, Typeface.BOLD)
                              background = round(bg, 8)
                              setOnClickListener { stockRack = if (stockRack == i) 0 else i; showStock() }
                          }, LinearLayout.LayoutParams(0, dp(54), 1f).apply { setMargins(dp(2), dp(2), dp(2), dp(2)) })
                      }
                      if (stockRack > 0) {
                          val c = card()
                          val inRack = st.filter { it.loc.startsWith("$stockZone$stockRack-") }
                          c.addView(label("$stockZone$stockRack · ${inRack.size}개", 18f, Color.WHITE, true))
                          for (lev in 5 downTo 1) {
                              val here = st.filter { it.loc == "$stockZone$stockRack-$lev" }
                              c.addView(label("${lev}단" + if (here.isEmpty()) "  비어있음" else "  ${here.size}개", 14f, if (here.isEmpty()) DIM else GREEN, true).apply { setPadding(0, dp(8), 0, 0) })
                              for (it in here) c.addView(itemRow(it, shortDate(it.inDate), Color.rgb(243, 201, 138), Color.rgb(36, 41, 51), n = 0) { itemMenu(it) })
                          }
                          content.addView(c)
                      } else content.addView(label("랙을 누르면 단별로 보여요", 13f, SUB).apply { gravity = Gravity.CENTER; setPadding(0, dp(10), 0, 0) })
                  }
                  page(topBar("총재고", "${st.size}개", BLUE), content, null)
              }

              private fun itemMenu(it: RItem) {
                  val opts = arrayOf("B/L 입력·수정", "입고일 수정", "품명·수량·LOT 수정", "다른 칸으로 이동", "출고 처리", "삭제 (잘못 등록)")
                  AlertDialog.Builder(this).setTitle("${it.lot} · ${it.loc}")
                      .setItems(opts) { _, w ->
                          when (w) {
                              0 -> textDialog("B/L", it.bl) { v -> it.bl = v.uppercase(); if (v.isNotBlank()) addRecent(it.bl); save(); redraw() }
                              1 -> dateDialog(it.inDate) { d -> it.inDate = d; save(); redraw() }
                              2 -> editItem(it)
                              3 -> { moveSel.clear(); moveSel.add(it.id); setPickFrom(it.loc); showMove() }
                              4 -> ask("출고 처리", "${it.lot} (${it.loc})", "출고") { outOne(it); redraw() }
                              5 -> ask("삭제", "${it.lot} (${it.loc}) 를 지울까요?\n(출고 기록 없이 지워져요)", "삭제") { log("삭제", it); val id = it.id; items.removeAll { x -> x.id == id }; save(); redraw() }
                          }
                      }.show()
              }

              private fun editItem(it: RItem) {
                  val box = vbox().apply { setPadding(dp(20), dp(8), dp(20), 0) }
                  val eLot = field("LOT", it.lot); val eName = field("품명", it.name, false); val eQty = field("수량", it.qty, false); val eSize = field("사이즈", it.size, false)
                  box.addView(eLot); box.addView(eName); box.addView(eQty); box.addView(eSize)
                  AlertDialog.Builder(this).setTitle("수정").setView(box)
                      .setPositiveButton("저장") { _, _ ->
                          it.lot = eLot.text.toString().trim().uppercase(); it.name = eName.text.toString().trim()
                          it.qty = eQty.text.toString().trim(); it.size = eSize.text.toString().trim()
                          save(); redraw()
                      }.setNegativeButton("취소", null).show()
              }

              private fun redraw() {
                  when (screen) {
                      "stock" -> showStock()
                      "bl" -> showBl()
                      "out" -> showOut()
                      "move" -> showMove()
                      "ref" -> showRef()
                      "place" -> showPlace()
                      else -> showHome()
                  }
              }

              // ======================= 재고 이동 =======================
              private fun showMove() {
                  screen = "move"
                  val sel = items.filter { it.id in moveSel && it.loc.isNotEmpty() }
                  val content = vbox()
                  content.addView(row(
                      big(btn("라벨 찍기", BLUE) { startScan("move") }, 56, 16f),
                      big(btn("칸에서 고르기", GREY) { pickFromCell() }, 56, 16f)
                  ))
                  content.addView(label("옮길 것 · ${sel.size}개", 14f, SUB, true))
                  for (it in sel) content.addView(itemRow(it, "지금 ${it.loc}  ✕", SUB, Color.rgb(40, 34, 70), PURPLE, n = 0) { moveSel.remove(it.id); showMove() })
                  if (sel.isEmpty()) content.addView(label("라벨을 찍거나 칸에서 골라주세요", 13f, DIM).apply { gravity = Gravity.CENTER; setPadding(0, dp(12), 0, dp(12)) })
                  content.addView(label("▼ 어디로", 15f, PURPLE, true).apply { gravity = Gravity.CENTER; setPadding(0, dp(8), 0, dp(4)) })
                  val info = label("", 13f, SUB).apply { gravity = Gravity.CENTER }
                  fun upd() { info.text = "${pickLoc()} 현재 ${at(pickLoc()).size}개" }
                  content.addView(locPicker({ showMove() }, { upd() }))
                  upd(); content.addView(info)
                  val bottom = vbox()
                  bottom.addView(big(btn(if (sel.isEmpty()) "옮길 걸 먼저 고르세요" else "${sel.size}개 → ${pickLoc()} 이동", if (sel.isEmpty()) GREY else PURPLE) {
                      if (sel.isEmpty()) return@btn
                      val to = pickLoc()
                      for (x in sel) { val from = x.loc; x.loc = to; log("이동", x, "$from→$to") }
                      moveSel.clear(); save(); buzz(150)
                      toast("${sel.size}개 → $to 이동")
                      showMove()
                  }))
                  page(topBar("재고 이동", "${sel.size}개", PURPLE), content, bottom)
              }

              private fun pickFromCell() {
                  val box = vbox().apply { setPadding(dp(12), dp(8), dp(12), 0); setBackgroundColor(BG) }
                  val saveZ = pickZone; val saveN = pickNum; val saveL = pickLev
                  lateinit var dlg: AlertDialog
                  fun build() {
                      box.removeAllViews()
                      box.addView(locPicker({ build() }, { }))
                  }
                  build()
                  dlg = AlertDialog.Builder(this).setTitle("어느 칸에서?").setView(box)
                      .setPositiveButton("이 칸 보기") { _, _ ->
                          val loc = pickLoc()
                          val here = at(loc)
                          pickZone = saveZ; pickNum = saveN; pickLev = saveL
                          if (here.isEmpty()) { toast("$loc 비어있어요"); return@setPositiveButton }
                          val names = here.map { "${it.lot} · ${it.name}" }.toTypedArray()
                          val checks = BooleanArray(here.size) { true }
                          AlertDialog.Builder(this).setTitle("$loc · 옮길 것 체크")
                              .setMultiChoiceItems(names, checks) { _, i, c -> checks[i] = c }
                              .setPositiveButton("추가") { _, _ -> here.forEachIndexed { i, x -> if (checks[i]) moveSel.add(x.id) }; showMove() }
                              .setNegativeButton("취소", null).show()
                      }
                      .setNegativeButton("취소") { _, _ -> pickZone = saveZ; pickNum = saveN; pickLev = saveL }
                      .create()
                  dlg.show()
              }

              // ======================= 출고 =======================
              private fun showOut() {
                  screen = "out"
                  val content = vbox()
                  content.addView(big(btn("📷 출고 캡처 불러오기", RED) { imgPurpose = "out"; pickImages.launch("image/*") }, 60, 17f))
                  content.addView(label("카톡에서 캡처를 '공유 → A2 도크'로 보내도 돼요", 12f, SUB))
                  if (outRows.isEmpty()) {
                      content.addView(label("출고 목록이 없어요", 14f, DIM).apply { gravity = Gravity.CENTER; setPadding(0, dp(20), 0, 0) })
                  } else {
                      val all = outRows.flatMap { it.ids }.distinct()
                      val list = items.filter { it.id in all && it.loc.isNotEmpty() }.sortedBy { locSortKey(it.loc) }
                      val miss = outRows.filter { r -> r.ids.none { id -> items.any { it.id == id && it.loc.isNotEmpty() } } }
                      content.addView(label("${outRows.size}건 읽음 · 재고 매칭 ${list.size} · 없음 ${miss.size} · 완료 ${list.count { it.id in outPicked }}", 14f, SUB, true))
                      content.addView(label("랙 순서대로 · 뺀 건 눌러서 체크", 12f, SUB))
                      for (it in list) {
                          val done = it.id in outPicked
                          content.addView(itemRow(it, if (done) "✓ 뺌" else it.loc, if (done) GREEN else Color.WHITE,
                              if (done) Color.rgb(24, 27, 33) else CARD, if (done) null else Color.rgb(60, 66, 80), n = 0) {
                              if (!outPicked.add(it.id)) outPicked.remove(it.id); buzz(40); showOut()
                          }.apply { if (done) alpha = 0.55f })
                      }
                      for (r in miss) {
                          content.addView(LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL; background = round(Color.argb(40, 224, 87, 79), 12, RED)
                              setPadding(dp(12), dp(8), dp(12), dp(8))
                              layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, dp(3), 0, dp(3)) }
                              addView(label(r.lot, 16f, Color.WHITE, true))
                              addView(label("재고에 없음 · 눌러서 고치기/빼기", 12f, Color.rgb(255, 180, 170)))
                              setOnClickListener {
                                  AlertDialog.Builder(this@RackActivity).setTitle(r.lot)
                                      .setItems(arrayOf("LOT 고치기", "목록에서 빼기")) { _, w ->
                                          if (w == 0) textDialog("LOT 고치기", r.lot) { v -> r.lot = v.uppercase(); r.ids = matchLot(r.lot); showOut() }
                                          else { outRows.remove(r); showOut() }
                                      }.show()
                              }
                          })
                      }
                      content.addView(row(
                          btn("＋ LOT 직접") { textDialog("출고 LOT 추가", "") { v -> if (v.isNotBlank()) { outRows.add(OutRow(v.uppercase(), matchLot(v.uppercase()))); showOut() } } },
                          btn("목록 비우기") { ask("출고 목록 비우기", "읽은 출고 목록을 지울까요?", "지우기") { outRows.clear(); outPicked.clear(); showOut() } }
                      ))
                  }
                  val bottom = vbox()
                  val n = outPicked.count { id -> items.any { it.id == id && it.loc.isNotEmpty() } }
                  bottom.addView(big(btn(if (n == 0) "뺀 걸 체크하세요" else "✓ ${n}개 출고 처리", if (n == 0) GREY else TEAL) {
                      if (n == 0) return@btn
                      ask("출고 처리", "${n}개를 재고에서 빼고 출고 기록에 남길까요?", "출고") {
                          val sel = items.filter { it.id in outPicked && it.loc.isNotEmpty() }
                          for (x in sel) outOne(x)
                          outPicked.clear()
                          outRows.removeAll { r -> r.ids.isNotEmpty() && r.ids.none { id -> items.any { it.id == id } } }
                          save(); buzz(150); toast("${sel.size}개 출고 처리"); showOut()
                      }
                  }))
                  page(topBar("출고 · 피킹", if (outRows.isEmpty()) "" else "${outRows.size}건", RED), content, bottom)
              }

              private fun matchLot(lot: String): List<Long> {
                  val l = lot.uppercase().replace(" ", "")
                  return stock().filter { it.lot.uppercase() == l }.map { it.id }
              }

              private fun outOne(it: RItem) {
                  log("출고", it)
                  val id = it.id
                  items.removeAll { x -> x.id == id }
                  save()
              }

              // ======================= 이미지 읽기 (출고 / 재고목록) =======================
              private fun readImages(uris: List<Uri>, purpose: String) {
                  val dlg = AlertDialog.Builder(this).setTitle("글자 읽는 중").setMessage("0 / ${uris.size}").setCancelable(false).show()
                  val found = ArrayList<RRef>()
                  val texts = StringBuilder()
                  fun next(i: Int) {
                      if (i >= uris.size) {
                          dlg.dismiss()
                          if (purpose == "out") applyOut(found, texts.toString()) else applyRefs(found)
                          return
                      }
                      dlg.setMessage("${i + 1} / ${uris.size}")
                      try {
                          val img = InputImage.fromFilePath(this, uris[i])
                          textRec.process(img)
                              .addOnSuccessListener { t -> found.addAll(Labels.rows(t)); texts.append(t.text).append('\n') }
                              .addOnFailureListener { e -> toast("읽기 실패: ${e.message}") }
                              .addOnCompleteListener { next(i + 1) }
                      } catch (e: Exception) { toast("이미지 열기 실패: ${e.message}"); next(i + 1) }
                  }
                  next(0)
              }

              private fun applyOut(rows: List<RRef>, text: String) {
                  val lots = LinkedHashSet<String>()
                  rows.forEach { lots.add(it.lot) }
                  text.split('\n').forEach { l -> Labels.allLots(Labels.norm(l)).forEach { lots.add(it) } }
                  // 글자 전체에 재고 LOT 가 들어있으면 그것도 (Polyhose 등)
                  val whole = Labels.norm(text)
                  for (s in stock()) if (s.lot.length >= 6 && whole.contains(s.lot.uppercase().replace(" ", ""))) lots.add(s.lot.uppercase())
                  var added = 0
                  for (l in lots) {
                      if (outRows.any { it.lot == l }) continue
                      outRows.add(OutRow(l, matchLot(l))); added++
                  }
                  // 출고 캡처에 B/L 이 있고 재고에 B/L 이 비었으면 채움
                  var blFill = 0
                  for (r in rows) if (r.bl.isNotBlank()) for (s in stock()) if (s.lot == r.lot && s.bl.isBlank()) { s.bl = r.bl; blFill++ }
                  save()
                  toast("LOT ${added}건 추가" + if (blFill > 0) " · B/L ${blFill}개 채움" else "")
                  showOut()
              }

              private fun applyRefs(rows: List<RRef>, gone: Set<String> = emptySet()) {
                  if (rows.isEmpty()) { toast("LOT를 못 찾았어요"); showRef(); return }
                  var removed = 0
                  for (g in gone) if (refs.remove(g) != null) removed++
                  var n = 0
                  for (r in rows) {
                      val old = refs[r.lot]
                      refs[r.lot] = RRef(r.lot,
                          r.name.ifBlank { old?.name ?: "" }, r.qty.ifBlank { old?.qty ?: "" },
                          r.bl.ifBlank { old?.bl ?: "" }, r.inDate.ifBlank { old?.inDate ?: "" })
                      n++
                  }
                  val filled = fillFromRefs()
                  save()
                  toast("재고 남은 ${n}줄 읽음" + (if (gone.isNotEmpty()) " · 출고 끝난 ${gone.size}줄 뺌" else "") + if (filled > 0) " · 재고 ${filled}개 B/L·입고일 채움" else "")
                  showRef()
              }

              /** 재고 중 B/L·품명이 빈 것을 목록으로 채움 */
              private fun fillFromRefs(): Int {
                  var n = 0
                  for (s in items) {
                      val r = refs[s.lot] ?: continue
                      var ch = false
                      if (s.bl.isBlank() && r.bl.isNotBlank()) { s.bl = r.bl; ch = true }
                      if (s.name.isBlank() || s.name.startsWith("P4")) if (r.name.isNotBlank()) { s.name = r.name; ch = true }
                      if (r.inDate.isNotBlank() && s.inDate != r.inDate) { s.inDate = r.inDate; ch = true }
                      if (ch) n++
                  }
                  return n
              }


          cat > 'app/src/main/java/com/nakyung/a2dock/Fb.kt' <<'TALLY_EOF'
          package com.nakyung.a2dock

          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /** Firebase Realtime Database (REST). 주소·키는 빌드할 때 GitHub Secrets 에서 들어옴 */
          object Fb {
              val enabled: Boolean get() = BuildInfo.FB_URL.startsWith("https://") && BuildInfo.FB_KEY.isNotBlank()

              private fun url(path: String): String {
                  val base = BuildInfo.FB_URL.trim().trimEnd('/')
                  return "$base/$path.json?auth=${BuildInfo.FB_KEY.trim()}"
              }

              /** Firebase 키로 못 쓰는 글자 바꾸기 */
              fun safeKey(s: String): String = s.replace(Regex("[.#$\\[\\]/]"), "_").ifBlank { "_" }

              fun get(path: String): String {
                  val c = URL(url(path)).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000; c.readTimeout = 40000
                  val code = c.responseCode
                  if (code != 200) throw Exception("Firebase HTTP $code")
                  return c.inputStream.bufferedReader().use { it.readText() }
              }

              /** 여러 곳을 한 번에 바꾸기 (값이 JSONObject.NULL 이면 삭제) */
              fun patchRoot(body: JSONObject) {
                  val c = URL(url("")).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.setRequestProperty("X-HTTP-Method-Override", "PATCH")
                  c.doOutput = true
                  c.connectTimeout = 15000; c.readTimeout = 40000
                  c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  if (code != 200) {
                      val err = try { c.errorStream?.bufferedReader()?.use { it.readText() } } catch (e: Exception) { null }
                      throw Exception("Firebase HTTP $code ${err ?: ""}".trim())
                  }
                  c.inputStream.close()
              }

              /**
               * path 가 바뀔 때마다 onChange (실시간 스트림). alive() 가 false 가 되면 멈춤.
               */
              fun listen(path: String, alive: () -> Boolean, onChange: () -> Unit) {
                  Thread {
                      while (alive()) {
                          var c: HttpURLConnection? = null
                          try {
                              c = URL(url(path)).openConnection() as HttpURLConnection
                              c.setRequestProperty("Accept", "text/event-stream")
                              c.connectTimeout = 15000; c.readTimeout = 90000
                              c.instanceFollowRedirects = true
                              val r = c.inputStream.bufferedReader()
                              var ev = ""
                              while (alive()) {
                                  val line = r.readLine() ?: break
                                  if (line.startsWith("event:")) ev = line.substring(6).trim()
                                  else if (line.startsWith("data:")) {
                                      if (ev == "put" || ev == "patch") onChange()
                                      if (ev == "cancel" || ev == "auth_revoked") break
                                  }
                              }
                          } catch (e: Exception) {
                          } finally {
                              try { c?.disconnect() } catch (e: Exception) { }
                          }
                          if (alive()) try { Thread.sleep(3000) } catch (e: Exception) { }
                      }
                  }.start()
              }

              /**
               * 실시간 스트림: 처음엔 전체(put "/"), 그 뒤엔 바뀐 부분만 (put/patch) 받음
               * onEvent(종류, 경로, 데이터) 는 백그라운드 스레드에서 불림
               */
              fun stream(path: String, alive: () -> Boolean, onEvent: (String, String, Any?) -> Unit) {
                  Thread {
                      while (alive()) {
                          var c: HttpURLConnection? = null
                          try {
                              c = URL(url(path)).openConnection() as HttpURLConnection
                              c.setRequestProperty("Accept", "text/event-stream")
                              c.connectTimeout = 15000; c.readTimeout = 90000
                              c.instanceFollowRedirects = true
                              val r = c.inputStream.bufferedReader()
                              var ev = ""
                              while (alive()) {
                                  val line = r.readLine() ?: break
                                  if (line.startsWith("event:")) ev = line.substring(6).trim()
                                  else if (line.startsWith("data:")) {
                                      val d = line.substring(5).trim()
                                      if ((ev == "put" || ev == "patch") && d != "null") {
                                          try {
                                              val o = JSONObject(d)
                                              onEvent(ev, o.optString("path", "/"), o.opt("data"))
                                          } catch (e: Exception) { }
                                      }
                                      if (ev == "cancel" || ev == "auth_revoked") break
                                  }
                              }
                          } catch (e: Exception) {
                          } finally {
                              try { c?.disconnect() } catch (e: Exception) { }
                          }
                          if (alive()) try { Thread.sleep(3000) } catch (e: Exception) { }
                      }
                  }.start()
              }

              /** 스트림 이벤트를 내 사본(JSON 트리)에 적용. 바뀐 루트를 돌려줌 */
              fun applyTo(root: JSONObject, ev: String, path: String, data: Any?): JSONObject {
                  val segs = path.split('/').filter { it.isNotEmpty() }
                  if (segs.isEmpty() && ev == "put") return if (data is JSONObject) data else JSONObject()
                  if (ev == "put") {
                      setAt(root, segs, data)
                  } else if (data is JSONObject) {
                      val keys = data.keys().asSequence().toList()
                      for (k in keys) setAt(root, segs + k.split('/').filter { it.isNotEmpty() }, data.opt(k))
                  }
                  return root
              }

              private fun setAt(root: JSONObject, segs: List<String>, v: Any?) {
                  if (segs.isEmpty()) return
                  var cur = root
                  for (i in 0 until segs.size - 1) {
                      val n = cur.optJSONObject(segs[i]) ?: JSONObject().also { cur.put(segs[i], it) }
                      cur = n
                  }
                  val last = segs.last()
                  if (v == null || v == JSONObject.NULL) {
                      cur.remove(last)
                  } else {
                      cur.put(last, v)
                  }
              }

              /** 사용자 이름 (랙 재고·도크 공통) */
              fun userName(ctx: android.content.Context): String =
                  ctx.getSharedPreferences("rack", android.content.Context.MODE_PRIVATE).getString("user", "") ?: ""
          }
          TALLY_EOF

              // ---------- 랙 재고 요약 (이 폰에 저장된 rack.json) ----------
              private class RackSum(val total: Int, val a: Int, val b: Int, val f: Int, val noBl: Int, val batch: String, val wait: Int, val hist: List<JSONObject>)

              private fun readRack(): RackSum {
                  var t = 0; var a = 0; var b = 0; var f = 0; var nb = 0; var wait = 0; var batch = ""
                  val hs = ArrayList<JSONObject>()
                  try {
                      val fl = File(filesDir, "rack.json")
                      if (fl.exists()) {
                          val o = JSONObject(fl.readText())
                          batch = o.optString("batch")
                          o.optJSONArray("items")?.let { arr ->
                              for (i in 0 until arr.length()) {
                                  val x = RItem.of(arr.getJSONObject(i))
                                  if (x.loc.isEmpty()) { if (batch.isNotEmpty() && x.batch == batch) wait++; continue }
                                  t++
                                  when { x.loc == "평치" -> f++; x.loc.startsWith("A") -> a++; x.loc.startsWith("B") -> b++ }
                                  if (x.bl.isBlank()) nb++
                              }
                          }
                          o.optJSONArray("hist")?.let { arr -> for (i in 0 until arr.length()) hs.add(arr.getJSONObject(i)) }
                      }
                  } catch (e: Exception) { }
                  return RackSum(t, a, b, f, nb, batch, wait, hs)
              }


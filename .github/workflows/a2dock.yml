                  val user = Fb.userName(this)
                  head.addView(label(SimpleDateFormat("yyyy.MM.dd (E)", Locale.KOREA).format(Date()) + if (user.isNotBlank()) "  ·  👤 $user" else "", 13f, Color.argb(225, 255, 255, 255)))
                  if (Fb.enabled) head.addView(label(shareText(), 12f, if (dockErr.isNotEmpty()) Color.rgb(255, 200, 190) else Color.argb(210, 200, 255, 220)))
                  root.addView(head)

                  // 도크
                  val bls = allBl()
                  val gapL = left.filter { it.gap }.sumOf { it.lines }; val gapR = right.filter { it.gap }.sumOf { it.lines }
                  val useL = left.filter { !it.gap }.sumOf { it.lines }; val useR = right.filter { !it.gap }.sumOf { it.lines }
                  root.addView(section("▦  도크"))
                  val dc = card()
                  dc.addView(row(Ui.stat(this, "${bls.size}", "B/L"), Ui.stat(this, "${bls.sumOf { it.second.pallets }}", "파레트"), Ui.stat(this, "${gapL + gapR}", "빈자리 줄", GREEN)))
                  dc.addView(row(
                      label("◀ 좌측  ${useL}줄 · 빈 ${gapL}", 13f, SUB).apply { gravity = Gravity.CENTER },
                      label("우측 ▶  ${useR}줄 · 빈 ${gapR}", 13f, SUB).apply { gravity = Gravity.CENTER }
                  ))
                  dc.addView(row(
                      btn("＋ 입고", TEAL) { showInbound(null, null) },
                      btn("－ 출고", DANGER) { showOutbound(null) },
                      btn("배치도 ›", PRIMARY) { showMain() }
                  ))
                  root.addView(dc)

                  // 랙 재고
                  val rk = readRack()
                  root.addView(section("▤  랙 재고"))
                  val rc = card()
                  rc.addView(row(Ui.stat(this, "${rk.total}", "총 재고"), Ui.stat(this, "${rk.a}", "A랙"), Ui.stat(this, "${rk.b}", "B랙"), Ui.stat(this, "${rk.f}", "평치")))
                  if (rk.batch.isNotEmpty()) rc.addView(label("● 입고 진행 중 · ${rk.batch} · 적치 대기 ${rk.wait}개", 14f, Color.rgb(120, 190, 255), true))

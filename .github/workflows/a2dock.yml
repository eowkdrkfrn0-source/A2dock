              private fun exportXlsx2(hs: List<JSONObject>) {
                  try {
                      val st = stock().sortedBy { locSortKey(it.loc) }
                      val s1 = ArrayList<List<String>>()
                      s1.add(listOf("위치", "제조사", "품명", "LOT", "사이즈", "수량", "입고일", "B/L", "입고건"))
                      for (x in st) s1.add(listOf(x.loc, x.mk, x.name, x.lot, x.size, x.qty, x.inDate, x.bl, x.batch))
                      val s2 = ArrayList<List<String>>()
                      s2.add(listOf("시각", "구분", "LOT", "품명", "위치", "B/L", "입고일", "메모", "작업자"))
                      for (h in hs.asReversed()) s2.add(listOf(h.optString("t"), h.optString("k"), h.optString("lot"), h.optString("name"),
                          h.optString("loc"), h.optString("bl"), h.optString("in"), h.optString("memo"), h.optString("who")))
                      val name = "랙재고_" + SimpleDateFormat("yyyyMMdd_HHmm", Locale.KOREA).format(Date()) + ".xlsx"
                      val f = File(File(cacheDir, "x"), name)
                      XlsxWrite.write(f, listOf("재고" to s1, "이력" to s2))
                      val uri = FileProvider.getUriForFile(this, "com.nakyung.a2dock.files", f)
                      startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                          type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, "엑셀 공유"))
                  } catch (e: Exception) { toast("엑셀 만들기 실패: ${e.message}") }
              }

              // ======================= 기록·저장 =======================
              private fun log(kind: String, it: RItem, memo: String = "") {
                  hist.add(JSONObject().apply {
                      histN++
                      put("n", histN); put("t", stamp()); put("k", kind); put("who", userName()); put("lot", it.lot); put("name", it.name)
                      put("loc", it.loc); put("bl", it.bl); put("in", it.inDate); put("memo", memo)
                  })
                  while (hist.size > 5000) hist.removeAt(0)
              }

              private fun save() {
                  saveLocal()
                  scheduleFlush()
              }

              private fun saveLocal() {
                  try {
                      val o = JSONObject()
                      o.put("items", JSONArray().apply { items.forEach { put(it.toJson()) } })
                      o.put("refs", JSONArray().apply { refs.values.forEach { put(it.toJson()) } })
                      o.put("hist", JSONArray().apply { hist.forEach { put(it) } })
                      o.put("recent", JSONArray().apply { recentBl.forEach { put(it) } })
                      o.put("batch", curBatch); o.put("bdate", batchDate); o.put("bseq", batchSeq); o.put("lastPlaced", lastPlacedLoc); o.put("hn", histN)
                      o.put("sItems", JSONObject().apply { for ((k, v) in syncedItems) put(k.toString(), v) })
                      o.put("sRefs", JSONObject().apply { for ((k, v) in syncedRefs) put(k, v) })
                      o.put("sHist", syncedHistN)
                      val f = File(filesDir, "rack.json")
                      val tmp = File(filesDir, "rack.json.tmp")
                      tmp.writeText(o.toString())
                      if (!tmp.renameTo(f)) { f.writeText(o.toString()); tmp.delete() }
                  } catch (e: Exception) { }
              }

              private fun load() {
                  try {
                      val f = File(filesDir, "rack.json")
                      if (f.exists()) {
                          val o = JSONObject(f.readText())
                          o.optJSONArray("items")?.let { a -> for (i in 0 until a.length()) items.add(RItem.of(a.getJSONObject(i))) }
                          o.optJSONArray("refs")?.let { a -> for (i in 0 until a.length()) { val r = RRef.of(a.getJSONObject(i)); refs[r.lot] = r } }
                          o.optJSONArray("hist")?.let { a -> for (i in 0 until a.length()) hist.add(a.getJSONObject(i)) }
                          o.optJSONArray("recent")?.let { a -> for (i in 0 until a.length()) recentBl.add(a.getString(i)) }
                          curBatch = o.optString("batch"); batchDate = o.optString("bdate"); batchSeq = o.optInt("bseq")
                          lastPlacedLoc = o.optString("lastPlaced"); histN = o.optLong("hn")
                          o.optJSONObject("sItems")?.let { j ->
                              for (k in j.keys()) {
                                  val id = k.toLongOrNull() ?: continue
                                  syncedItems[id] = j.optString(k)
                              }
                          }
                          o.optJSONObject("sRefs")?.let { j -> for (k in j.keys()) syncedRefs[k] = j.optString(k) }
                          syncedHistN = o.optLong("sHist")
                      }
                  } catch (e: Exception) { }
                  val ll = getSharedPreferences("rack", MODE_PRIVATE).getString("lastLoc", "") ?: ""
                  if (ll.isNotEmpty()) setPickFrom(ll)
                  if (batchDate.isEmpty()) batchDate = today()
              }

              // ======================= Firebase 공유 =======================
              private val handler = Handler(Looper.getMainLooper())
              private val flushRun = Runnable { flush() }
              private val mergeRun = Runnable { mergeFromServer() }
              private var srvItems = JSONObject()
              private var srvRefs = JSONObject()
              private var itemsReady = false
              private var refsReady = false
              private val syncedItems = HashMap<Long, String>()   // 서버에 있는 상태 (id → json)
              private val syncedRefs = HashMap<String, String>()
              private var syncedHistN = 0L
              private var fetchedOnce = false
              private var flushing = false
              private var flushAgain = false
              private var fetching = false
              private var syncErr = ""
              private var syncAt = ""
              @Volatile private var listenGen = 0
              private val rprefs by lazy { getSharedPreferences("rack", MODE_PRIVATE) }

              private fun userName(): String = rprefs.getString("user", "") ?: ""
              private fun devCode(): String {
                  val id = try { android.provider.Settings.Secure.getString(contentResolver, android.provider.Settings.Secure.ANDROID_ID) } catch (e: Exception) { null } ?: "x"
                  return id.uppercase().filter { it.isLetterOrDigit() }.take(8)
              }

              private fun askName(next: () -> Unit) {
                  if (userName().isNotBlank()) { next(); return }
                  val e = field("이름 (예: 윤나경)", "", false)
                  val box = vbox().apply { setPadding(dp(20), dp(8), dp(20), 0); addView(e) }
                  val d = AlertDialog.Builder(this).setTitle("사용자 이름")
                      .setMessage("입고·출고·이동 기록에 누가 했는지 남아요. 처음 한 번만 입력하세요.")
                      .setView(box).setCancelable(false).setPositiveButton("확인", null).show()
                  d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                      val n = e.text.toString().trim()
                      if (n.isEmpty()) toast("이름을 입력하세요") else { rprefs.edit().putString("user", n).apply(); d.dismiss(); next() }
                  }
              }

              private fun scheduleFlush() {
                  if (!Fb.enabled) return
                  handler.removeCallbacks(flushRun)
                  handler.postDelayed(flushRun, 400)
              }

              /** 실시간: 처음엔 전체, 그 뒤엔 바뀐 롤만 받아옴 */
              private fun startListen() {
                  if (!Fb.enabled) return
                  val gen = ++listenGen
                  itemsReady = false; refsReady = false
                  Fb.stream("items", { listenGen == gen }) { ev, path, data ->
                      handler.post {
                          if (listenGen != gen) return@post
                          srvItems = Fb.applyTo(srvItems, ev, path, data)
                          if (ev == "put" && path == "/") itemsReady = true
                          scheduleMerge()
                      }
                  }
                  Fb.stream("refs", { listenGen == gen }) { ev, path, data ->
                      handler.post {
                          if (listenGen != gen) return@post
                          srvRefs = Fb.applyTo(srvRefs, ev, path, data)
                          if (ev == "put" && path == "/") refsReady = true
                          scheduleMerge()
                      }
                  }
              }

              private fun scheduleMerge() {
                  handler.removeCallbacks(mergeRun)
                  handler.postDelayed(mergeRun, 300)
              }

              private fun mergeFromServer() {
                  if (!itemsReady || !refsReady) return
                  val first = !fetchedOnce
                  val hadErr = syncErr.isNotEmpty()
                  val server = HashMap<Long, String>()
                  for (k in srvItems.keys()) {
                      val j = srvItems.optJSONObject(k) ?: continue
                      val x = RItem.of(j)
                      if (x.id != 0L) server[x.id] = x.toJson().toString()     // 글자 순서 맞추기
                  }
                  val sref = HashMap<String, String>()
                  for (k in srvRefs.keys()) {
                      val j = srvRefs.optJSONObject(k) ?: continue
                      sref[k] = RRef.of(j).toJson().toString()
                  }
                  val changed = mergeRemote(server, sref)
                  fetchedOnce = true
                  syncErr = ""
                  saveLocal()
                  scheduleFlush()
                  if (changed) refreshView() else if ((first || hadErr) && screen == "home") showHome()
              }

              private fun stopListen() { listenGen++ }

              /** 내 변경분만 골라서 서버에 올리기 */
              private fun flush() {
                  if (!Fb.enabled || !fetchedOnce) return
                  if (flushing) { flushAgain = true; return }
                  val body = JSONObject()
                  val sentItems = HashMap<Long, String?>()
                  val now = HashMap<Long, String>()
                  for (x in items) now[x.id] = x.toJson().toString()
                  for ((id, js) in now) if (syncedItems[id] != js) { body.put("items/$id", JSONObject(js)); sentItems[id] = js }
                  for (id in syncedItems.keys) if (!now.containsKey(id)) { body.put("items/$id", JSONObject.NULL); sentItems[id] = null }
                  val sentRefs = HashMap<String, String?>()
                  val nowRefs = HashMap<String, String>()
                  for (r in refs.values) nowRefs[Fb.safeKey(r.lot)] = r.toJson().toString()
                  for ((k, js) in nowRefs) if (syncedRefs[k] != js) { body.put("refs/$k", JSONObject(js)); sentRefs[k] = js }
                  for (k in syncedRefs.keys) if (!nowRefs.containsKey(k)) { body.put("refs/$k", JSONObject.NULL); sentRefs[k] = null }
                  var maxN = syncedHistN
                  for (h in hist) {
                      val n = h.optLong("n")
                      if (n > syncedHistN) { body.put("hist/${devCode()}_${String.format(Locale.US, "%08d", n)}", h); if (n > maxN) maxN = n }
                  }
                  if (body.length() == 0) return
                  flushing = true
                  val histTo = maxN
                  Thread {
                      var err = ""
                      try { Fb.patchRoot(body) } catch (e: Exception) { err = e.message ?: "오류" }
                      runOnUiThread {
                          flushing = false
                          if (err.isEmpty()) {
                              for ((id, js) in sentItems) { if (js == null) syncedItems.remove(id) else syncedItems[id] = js }
                              for ((k, js) in sentRefs) { if (js == null) syncedRefs.remove(k) else syncedRefs[k] = js }
                              syncedHistN = histTo
                              syncErr = ""; syncAt = SimpleDateFormat("HH:mm:ss", Locale.KOREA).format(Date())
                              saveLocal()
                          } else {
                              syncErr = err
                              handler.postDelayed({ scheduleFlush() }, 5000)
                          }
                          if (screen == "home") showHome()
                          if (flushAgain) { flushAgain = false; scheduleFlush() }
                      }
                  }.start()
              }

              private fun mergeRemote(server: HashMap<Long, String>, sref: HashMap<String, String>): Boolean {
                  val local = HashMap<Long, RItem>()
                  for (x in items) local[x.id] = x
                  val pendingDel = syncedItems.keys.filter { !local.containsKey(it) }.toHashSet()
                  val out = ArrayList<RItem>()
                  var changed = false
                  for (x in items) {
                      val mine = x.toJson().toString()
                      val dirty = syncedItems[x.id] != mine
                      val sv = server[x.id]
                      if (dirty) {
                          out.add(x)                                           // 내가 바꾼 건 내 것 유지
                      } else if (sv != null) {
                          if (sv != mine) { changed = true; x.copyFrom(RItem.of(JSONObject(sv))) }
                          out.add(x)
                      } else {
                          changed = true                                       // 다른 사람이 지움
                      }
                  }
                  for ((id, js) in server) if (!local.containsKey(id) && id !in pendingDel) { out.add(RItem.of(JSONObject(js))); changed = true }
                  items.clear(); items.addAll(out)
                  syncedItems.clear(); syncedItems.putAll(server)

                  val localRefs = HashMap<String, RRef>()
                  for (r in refs.values) localRefs[Fb.safeKey(r.lot)] = r
                  val pendingRefDel = syncedRefs.keys.filter { !localRefs.containsKey(it) }.toHashSet()
                  val newRefs = LinkedHashMap<String, RRef>()
                  for ((k, r) in localRefs) {
                      val mine = r.toJson().toString()
                      val sv = sref[k]
                      if (syncedRefs[k] != mine) {
                          newRefs[r.lot] = r
                      } else if (sv != null) {
                          val rr = RRef.of(JSONObject(sv)); newRefs[rr.lot] = rr
                          if (sv != mine) changed = true
                      } else {
                          changed = true
                      }
                  }
                  for ((k, js) in sref) if (!localRefs.containsKey(k) && k !in pendingRefDel) { val rr = RRef.of(JSONObject(js)); newRefs[rr.lot] = rr; changed = true }
                  refs.clear(); refs.putAll(newRefs)
                  syncedRefs.clear(); syncedRefs.putAll(sref)
                  return changed
              }

              /** 다른 사람이 바꾼 게 들어오면 지금 화면 새로 그리기 */
              private fun refreshView() {
                  when (screen) {
                      "scan" -> fillScanList()
                      "home", "stock", "bl", "out", "move", "ref", "place" -> redraw()
                  }
              }

              /** 엑셀용 이력: 서버의 전체 이력 (실패하면 내 폰 기록) */
              private fun fetchHist(done: (List<JSONObject>) -> Unit) {
                  if (!Fb.enabled) { done(hist.toList()); return }
                  Thread {
                      val list = ArrayList<JSONObject>()
                      var ok = false
                      try {
                          val t = Fb.get("hist")
                          if (t.trim() != "null") { val o = JSONObject(t); for (k in o.keys()) o.optJSONObject(k)?.let { list.add(it) } }
                          ok = true
                      } catch (e: Exception) { }
                      list.sortBy { it.optString("t") }
                      runOnUiThread { done(if (ok) list else hist.toList()) }
                  }.start()
              }

          }

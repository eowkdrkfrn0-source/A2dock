                              setTextColor(if (on) ACCENT else DIM); setTypeface(typeface, Typeface.BOLD)
                          })
                          addView(TextView(c).apply {
                              text = name; textSize = 12f; gravity = Gravity.CENTER
                              setTextColor(if (on) Color.WHITE else DIM)
                              if (on) setTypeface(typeface, Typeface.BOLD)

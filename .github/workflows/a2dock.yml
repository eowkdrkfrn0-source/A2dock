          /** 랙 재고 한 개 (롤/파레트). loc 이 "" 이면 아직 적치 대기 */
          class RItem(
              var id: Long,
              var mk: String,
              var lot: String,
              var name: String,
              var qty: String,
              var size: String,
              var bl: String,
              var inDate: String,
              var loc: String,
              var batch: String,
              var seq: Int
          ) {
              fun key() = if (size.isNotBlank()) "$lot|$size" else lot
              /** 같은 객체를 유지한 채 값만 바꾸기 (화면에서 잡고 있는 참조가 안 끊기게) */
              fun copyFrom(o: RItem) {
                  mk = o.mk; lot = o.lot; name = o.name; qty = o.qty; size = o.size
                  bl = o.bl; inDate = o.inDate; loc = o.loc; batch = o.batch; seq = o.seq
              }
              fun toJson(): JSONObject = JSONObject().apply {
                  put("id", id); put("mk", mk); put("lot", lot); put("name", name); put("qty", qty); put("size", size)
                  put("bl", bl); put("in", inDate); put("loc", loc); put("batch", batch); put("seq", seq)
              }
              companion object {
                  fun of(o: JSONObject) = RItem(
                      o.optLong("id"), o.optString("mk"), o.optString("lot"), o.optString("name"), o.optString("qty"),
                      o.optString("size"), o.optString("bl"), o.optString("in"), o.optString("loc"), o.optString("batch"), o.optInt("seq")
                  )
              }
          }

          /** 사무실 재고 목록 한 줄 */
          class RRef(val lot: String, val name: String, val qty: String, val bl: String, val inDate: String) {
              fun toJson(): JSONObject = JSONObject().apply { put("lot", lot); put("name", name); put("qty", qty); put("bl", bl); put("in", inDate) }
              companion object {
                  fun of(o: JSONObject) = RRef(o.optString("lot"), o.optString("name"), o.optString("qty"), o.optString("bl"), o.optString("in"))
              }
          }

          /** 라벨에서 읽은 값 */
          class Parsed(val mk: String, val lot: String, val name: String = "", val qty: String = "", val size: String = "") {
              fun key() = if (size.isNotBlank()) "$lot|$size" else lot
          }

          object Labels {
              private val reGatesS = Regex("S1\\d{9}")
              private val rePL = Regex("P[L1I]\\d{8}")
              private val reXS = Regex("X[S5]\\d{4}-\\d{3}")
              private val rePoly = Regex("\\d{10}-\\d{3}")
              private val reBl = Regex("^[A-Z]{3,4}\\d{6,}$")
              private val reDate = Regex("20\\d\\d[-./]\\d{1,2}[-./]\\d{1,2}")

              fun norm(s: String): String = s.uppercase().replace(" ", "").replace("\n", "")

              private fun fixPL(v: String) = "PL" + v.substring(2)
              private fun fixXS(v: String) = "XS" + v.substring(2)

              /** 문자열 안의 첫 LOT */
              fun findLot(n: String): String? {
                  reXS.find(n)?.let { return fixXS(it.value) }
                  rePL.find(n)?.let { return fixPL(it.value) }
                  reGatesS.find(n)?.let { return it.value }
                  rePoly.find(n)?.let { return it.value }
                  return null
              }

              fun allLots(n: String): List<String> {
                  val out = ArrayList<String>()
                  reXS.findAll(n).forEach { out.add(fixXS(it.value)) }
                  rePL.findAll(n).forEach { out.add(fixPL(it.value)) }
                  reGatesS.findAll(n).forEach { out.add(it.value) }
                  rePoly.findAll(n).forEach { out.add(it.value) }
                  return out
              }

              /** 바코드/QR 값 → Gates QR(ANSI MH10), S로 시작하는 LOT 바코드, PL 바코드 */
              fun fromBarcode(raw: String): Parsed? {
                  if (raw.contains('\u001D') || raw.startsWith("[)>")) {
                      var lot = ""; var part = ""; var qty = ""; var unit = ""
                      for (t0 in raw.split('\u001D', '\u001E', '\u0004', '\n', '\r')) {
                          val t = t0.trim()
                          when {
                              t.isEmpty() || t.startsWith("[)>") -> {}
                              t.startsWith("3Q") -> unit = t.substring(2)
                              t.startsWith("P") -> part = t.substring(1)
                              t.startsWith("Q") -> qty = t.substring(1)
                              t.startsWith("S") && t.length > 4 -> lot = t
                          }
                      }
                      if (lot.isNotEmpty()) return Parsed("Gates", lot, if (part.isNotEmpty()) "P$part" else "", "$qty $unit".trim())
                  }
                  val r = raw.trim().uppercase()
                  if (Regex("S1\\d{9}").matches(r)) return Parsed("Gates", r)
                  if (Regex("PL\\d{8}").matches(r)) return Parsed("Semperflex", r)
                  return null
              }

              /** 카메라 글자 → 라벨 종류별 LOT */
              fun fromText(text: String): Parsed? {
                  val n = norm(text)
                  // Polyhose : 인보이스번호 + 박스번호
                  val inv = Regex("INV\\.?N[O0]\\.?[:;.]?(\\d{10})").find(n)?.groupValues?.get(1)
                  val box = Regex("B[O0]XN[O0]\\.?[:;.]?(\\d{1,4})").find(n)?.groupValues?.get(1)
                  if (inv != null && box != null) {
                      val prod = Regex("PH\\d{3}-\\d+").find(n)?.value ?: ""
                      return Parsed("Polyhose", "$inv-${box.padStart(3, '0')}", prod)
                  }
                  // Hengtong : LOT + 사이즈(소재 사양)
                  reXS.find(n)?.let { m ->
                      val lot = fixXS(m.value)
                      val size = Regex("[Ø0O@ΦφQ](\\d+(?:\\.\\d+)?)[*X×](\\d+(?:\\.\\d+)?)L[*X×][Ø0O@ΦφQ](\\d+(?:\\.\\d+)?)").find(n)
                          ?.let { "Ø${it.groupValues[1]}*${it.groupValues[2]}L*Ø${it.groupValues[3]}" } ?: ""
                      if (size.isEmpty()) return null
                      val name = Regex("\\d+GS-\\d+[A-Z0-9]+(\\([A-Z]+\\))?").find(n)?.value ?: ""
                      return Parsed("Hengtong", lot, name, "", size)
                  }
                  // Semperflex : PL 번호
                  rePL.find(n)?.let { m ->
                      val q = Regex("QUANTITY[:_]*([\\d,]+\\.\\d+)").find(n)?.groupValues?.get(1) ?: ""
                      return Parsed("Semperflex", fixPL(m.value), "", if (q.isNotEmpty()) "$q M" else "")
                  }
                  // Gates : S 로트 글자
                  reGatesS.find(n)?.let { return Parsed("Gates", it.value) }
                  return null
              }

              fun fixDate(s: String): String {
                  val p = s.split('-', '.', '/')
                  if (p.size < 3) return s
                  return "${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}"
              }

              private class L(val s: String, val r: Rect)

              /** 목록 캡처(표)에서 줄마다 LOT·B/L·입고일·품명·미터 뽑기 */
              fun rows(t: Text): List<RRef> {
                  val ls = t.textBlocks.flatMap { it.lines }.mapNotNull { l -> l.boundingBox?.let { L(l.text.trim(), it) } }
                  val out = ArrayList<RRef>()
                  val seen = HashSet<String>()
                  for (l in ls) {
                      val lot = findLot(norm(l.s)) ?: continue
                      if (!seen.add(lot)) continue
                      val cy = l.r.centerY()
                      val h = maxOf(l.r.height(), 14)
                      val row = ls.filter { abs(it.r.centerY() - cy) < h * 0.7 }.sortedBy { it.r.left }
                      var bl = ""; var date = ""; var qty = ""; var name = ""
                      for (x in row) {
                          for (tok in x.s.uppercase().split(' ', '\t')) {
                              val tk = tok.trim()
                              if (bl.isEmpty() && reBl.matches(tk) && findLot(tk) == null) bl = tk
                          }
                          if (date.isEmpty() && x.r.left >= l.r.left) reDate.find(norm(x.s))?.let { date = fixDate(it.value) }
                          if (qty.isEmpty() && x.r.right <= l.r.left && Regex("^[\\d,]+\\.\\d+$").matches(norm(x.s))) qty = norm(x.s)
                      }
                      val first = row.firstOrNull()
                      if (first != null && first !== l && first.r.right <= l.r.left && Regex("[A-Z]").containsMatchIn(first.s.uppercase()) && findLot(norm(first.s)) == null)
                          name = first.s
                      out.add(RRef(lot, name, if (qty.isNotEmpty()) "$qty M" else "", bl, date))
                  }
                  return out
              }
          }

          /** 간단한 xlsx 만들기 (글자만, 머리줄 굵게) */
          object XlsxWrite {
              private fun esc(s: String) = s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;")
              private fun col(i: Int): String {
                  var n = i + 1
                  val sb = StringBuilder()
                  while (n > 0) { val m = (n - 1) % 26; sb.insert(0, 'A' + m); n = (n - 1) / 26 }
                  return sb.toString()
              }

              fun write(f: File, sheets: List<Pair<String, List<List<String>>>>) {
                  f.parentFile?.mkdirs()
                  ZipOutputStream(f.outputStream()).use { z ->
                      fun put(name: String, s: String) { z.putNextEntry(ZipEntry(name)); z.write(s.toByteArray(Charsets.UTF_8)); z.closeEntry() }
                      val head = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>"
                      val ov = StringBuilder()
                      for (i in sheets.indices) ov.append("<Override PartName=\"/xl/worksheets/sheet${i + 1}.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>")
                      put("[Content_Types].xml", head + "<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">" +
                          "<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>" +
                          "<Default Extension=\"xml\" ContentType=\"application/xml\"/>" +
                          "<Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>" +
                          "<Override PartName=\"/xl/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>" +
                          ov + "</Types>")
                      put("_rels/.rels", head + "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" +
                          "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/></Relationships>")
                      val wbSheets = StringBuilder()
                      val wbRels = StringBuilder()
                      for ((i, sh) in sheets.withIndex()) {
                          wbSheets.append("<sheet name=\"${esc(sh.first)}\" sheetId=\"${i + 1}\" r:id=\"rId${i + 1}\"/>")
                          wbRels.append("<Relationship Id=\"rId${i + 1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet${i + 1}.xml\"/>")
                      }
                      wbRels.append("<Relationship Id=\"rIdS\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/>")
                      put("xl/workbook.xml", head + "<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets>" + wbSheets + "</sheets></workbook>")
                      put("xl/_rels/workbook.xml.rels", head + "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" + wbRels + "</Relationships>")
                      put("xl/styles.xml", head + "<styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">" +
                          "<fonts count=\"2\"><font><sz val=\"11\"/><name val=\"맑은 고딕\"/></font><font><b/><sz val=\"11\"/><name val=\"맑은 고딕\"/></font></fonts>" +
                          "<fills count=\"2\"><fill><patternFill patternType=\"none\"/></fill><fill><patternFill patternType=\"gray125\"/></fill></fills>" +
                          "<borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/></border></borders>" +
                          "<cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/></cellStyleXfs>" +
                          "<cellXfs count=\"2\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyFont=\"1\"/></cellXfs>" +
                          "</styleSheet>")
                      for ((i, sh) in sheets.withIndex()) {
                          val sb = StringBuilder(head)
                          sb.append("<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">")
                          val nCols = sh.second.maxOfOrNull { it.size } ?: 1
                          sb.append("<cols><col min=\"1\" max=\"$nCols\" width=\"18\" customWidth=\"1\"/></cols><sheetData>")
                          for ((ri, row) in sh.second.withIndex()) {
                              sb.append("<row r=\"${ri + 1}\">")
                              for ((ci, v) in row.withIndex()) {
                                  sb.append("<c r=\"${col(ci)}${ri + 1}\" t=\"inlineStr\"")
                                  if (ri == 0) sb.append(" s=\"1\"")
                                  sb.append("><is><t xml:space=\"preserve\">${esc(v)}</t></is></c>")
                              }
                              sb.append("</row>")
                          }
                          sb.append("</sheetData></worksheet>")
                          put("xl/worksheets/sheet${i + 1}.xml", sb.toString())
                      }
                  }
              }
          }

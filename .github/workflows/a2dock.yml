              // ======================= 위치 =======================
              private fun minRack(z: String) = if (z == "A") 23 else 1
              private fun maxRack(z: String) = if (z == "A") 34 else 36
              private fun pickLoc(): String {
                  if (pickZone == "F") return "평치"
                  pickNum = pickNum.coerceIn(minRack(pickZone), maxRack(pickZone))
                  return "$pickZone$pickNum-$pickLev"
              }
              private fun locSortKey(loc: String): Int {
                  if (loc == "평치") return 900000
                  if (loc.isEmpty()) return 999999
                  val z = if (loc.startsWith("A")) 0 else 1
                  val p = loc.substring(1).split('-')
                  val n = p.getOrNull(0)?.toIntOrNull() ?: 0
                  val l = p.getOrNull(1)?.toIntOrNull() ?: 0
                  return z * 100000 + n * 10 + l
              }
              private fun stock() = items.filter { it.loc.isNotEmpty() }
              private fun at(loc: String) = items.filter { it.loc == loc }

              private fun setPickFrom(loc: String) {
                  if (loc == "평치") { pickZone = "F"; return }
                  if (loc.length < 2) return
                  val z = loc.substring(0, 1)
                  val p = loc.substring(1).split('-')
                  val n = p.getOrNull(0)?.toIntOrNull() ?: return
                  val l = p.getOrNull(1)?.toIntOrNull() ?: return
                  if (z == "A" || z == "B") { pickZone = z; pickNum = n.coerceIn(minRack(z), maxRack(z)); pickLev = l.coerceIn(1, 5) }
              }

              private fun picker(max: Int, v: Int, min: Int = 1, onChange: (Int) -> Unit): NumberPicker =
                  NumberPicker(ContextThemeWrapper(this, android.R.style.Theme_Material)).apply {
                      minValue = min; maxValue = max; value = v.coerceIn(min, max); wrapSelectorWheel = false
                      descendantFocusability = NumberPicker.FOCUS_BLOCK_DESCENDANTS
                      if (Build.VERSION.SDK_INT >= 29) {
                          textSize = 34f * resources.displayMetrics.scaledDensity
                          setTextColor(Color.WHITE)
                      }
                      setOnValueChangedListener { _, _, nv -> onChange(nv) }
                  }

              /** A랙/B랙/평치 + 휠(랙번호·단). onChange 는 값이 바뀔 때 */
              private fun locPicker(onZone: () -> Unit, onChange: () -> Unit): LinearLayout {
                  if (pickZone != "F") pickNum = pickNum.coerceIn(minRack(pickZone), maxRack(pickZone))
                  val box = vbox()
                  val seg = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; background = round(CARD, 12); setPadding(dp(4), dp(4), dp(4), dp(4))
                  }
                  for ((z, name) in listOf("A" to "A랙", "B" to "B랙", "F" to "평치")) {
                      val on = pickZone == z
                      seg.addView(Button(this).apply {
                          text = name; textSize = 18f; isAllCaps = false; setTypeface(typeface, Typeface.BOLD)
                          setTextColor(if (on) Color.WHITE else SUB); stateListAnimator = null
                          background = round(if (on) (if (z == "F") ORANGE else BLUE) else CARD, 9)
                          setOnClickListener {
                              if (pickZone != z) { pickZone = z; if (z != "F") pickNum = pickNum.coerceIn(minRack(z), maxRack(z)); onZone() }
                          }
                      }, LinearLayout.LayoutParams(0, dp(50), 1f).apply { setMargins(dp(2), 0, dp(2), 0) })
                  }
                  box.addView(seg)
                  if (pickZone != "F") {
                      val wheels = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; background = round(CARD, 16); setPadding(dp(10), dp(6), dp(10), dp(6))
                          gravity = Gravity.CENTER
                      }
                      fun col(t: String, p: NumberPicker): LinearLayout = vbox().apply {
                          gravity = Gravity.CENTER_HORIZONTAL
                          addView(label(t, 12f, SUB).apply { gravity = Gravity.CENTER })
                          addView(p, LinearLayout.LayoutParams(-2, dp(150)))
                      }
                      wheels.addView(col("${pickZone}랙 번호", picker(maxRack(pickZone), pickNum, minRack(pickZone)) { pickNum = it; onChange() }), LinearLayout.LayoutParams(0, -2, 1f))
                      wheels.addView(col("단", picker(5, pickLev) { pickLev = it; onChange() }), LinearLayout.LayoutParams(0, -2, 1f))
                      box.addView(wheels, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })
                  }
                  return box
              }


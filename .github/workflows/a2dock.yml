              // ======================= 기록 =======================
              private fun log(kind: String, s: Slot, side: Char) {
                  history.add(0, "${now()}|$kind|${s.bl}|${s.pallets}|${s.lines}|${sideName(side)}|${s.memo}|${Fb.userName(this)}")
                  if (history.size > 2000) history.removeAt(history.lastIndex)
                  save()
              }

              private fun shareCsv() {
                  val sb = StringBuilder("﻿시각,구분,B/L,파레트,줄,공간,메모,작업자\n")
                  for (h in history) {
                      val p = h.split("|"); if (p.size < 7) continue
                      sb.append(p.joinToString(",") { "\"" + it.replace("\"", "\"\"") + "\"" }).append("\n")
                  }
                  sb.append("\n현재 배치\n공간,순서,구분,B/L,파레트,줄,메모\n")
                  for ((side, l) in kotlin.collections.listOf(Pair("좌측", left), Pair("우측", right)))
                      l.forEachIndexed { i, s -> sb.append("$side,${i + 1},${if (s.gap) "빈자리" else "B/L"},${s.bl},${s.pallets},${s.lines},\"${s.memo}\"\n") }
                  val f = File(cacheDir, "A2도크_" + SimpleDateFormat("yyyyMMdd_HHmm", Locale.KOREA).format(Date()) + ".csv")
                  f.writeText(sb.toString(), Charsets.UTF_8)
                  val uri = FileProvider.getUriForFile(this, "com.nakyung.a2dock.files", f)
                  startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                      type = "text/csv"; putExtra(Intent.EXTRA_STREAM, uri); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }, "공유"))
              }

              // ======================= 변경·되돌리기·저장 =======================
              private fun change(f: () -> Unit) {
                  undoStack.add(stateJson().toString())
                  if (undoStack.size > 30) undoStack.removeAt(0)
                  f()
                  mergeGaps(left); mergeGaps(right)
                  save()
                  refreshTab()
              }

              private fun undo() {
                  if (undoStack.isEmpty()) { toast("되돌릴 게 없어요"); return }
                  applyJson(JSONObject(undoStack.removeAt(undoStack.lastIndex)), withHistory = false)
                  save(); toast("되돌렸어요"); showMain()
              }

              private fun slotJson(s: Slot) = JSONObject().apply {
                  put("g", s.gap); put("b", s.bl); put("p", s.pallets); put("l", s.lines); put("m", s.memo); put("d", s.date)
              }

              private fun stateJson(): JSONObject = JSONObject().apply {
                  put("L", JSONArray(left.map { slotJson(it) }))
                  put("R", JSONArray(right.map { slotJson(it) }))
                  put("H", JSONArray(history))
              }

              private fun applyJson(o: JSONObject, withHistory: Boolean) {
                  fun read(a: JSONArray?, to: MutableList<Slot>) {
                      to.clear(); if (a == null) return
                      for (i in 0 until a.length()) {
                          val j = a.getJSONObject(i)
                          to.add(Slot(j.optBoolean("g"), j.optString("b"), j.optInt("p"), maxOf(1, j.optInt("l", 1)), j.optString("m"), j.optString("d")))
                      }
                  }
                  read(o.optJSONArray("L"), left); read(o.optJSONArray("R"), right)
                  if (withHistory) {
                      history.clear()
                      val h = o.optJSONArray("H")
                      if (h != null) for (i in 0 until h.length()) history.add(h.getString(i))
                  }
              }

              private fun save() {
                  saveLocal()
                  scheduleDockPush()
              }

              private fun saveLocal() {
                  getSharedPreferences("a2dock", MODE_PRIVATE).edit().putString("s", stateJson().toString())
                      .putString("srv", lastDockServer).putString("loc", lastDockLocal).apply()
              }

              // ======================= Firebase 도크 공유 =======================
              private val handler = Handler(Looper.getMainLooper())
              @Volatile private var dockGen = 0
              private var srvDock = JSONObject()
              private var dockReady = false
              private var dockPushing = false
              private var dockAgain = false
              private var dockErr = ""
              private var dockShown = false
              private var lastDockServer = ""   // 서버에 마지막으로 있던 배치도
              private var lastDockLocal = ""    // 그때 내 배치도
              private val dockMergeRun = Runnable { dockMerge() }
              private val dockPushRun = Runnable { pushDock() }

              private fun startDock() {
                  if (!Fb.enabled) return
                  val gen = ++dockGen
                  dockReady = false
                  Fb.stream("dock", { dockGen == gen }) { ev, path, data ->
                      handler.post {
                          if (dockGen != gen) return@post
                          srvDock = Fb.applyTo(srvDock, ev, path, data)
                          if (ev == "put" && path == "/") dockReady = true
                          handler.removeCallbacks(dockMergeRun)
                          handler.postDelayed(dockMergeRun, 250)
                      }
                  }
              }

              private fun scheduleDockPush() {
                  if (!Fb.enabled) return
                  handler.removeCallbacks(dockPushRun)
                  handler.postDelayed(dockPushRun, 500)
              }

              /** 서버 배치도가 바뀌었으면 받아오고, 내 것만 바뀌었으면 올림 */
              private fun dockMerge() {
                  if (!dockReady) return
                  val wasErr = dockErr.isNotEmpty()
                  dockErr = ""
                  val s = srvDock.optString("s", "")
                  val mine = stateJson().toString()
                  val localDirty = mine != lastDockLocal
                  if (s.isEmpty()) {
                      if (left.isNotEmpty() || right.isNotEmpty() || history.isNotEmpty()) pushDock()
                      refreshTab()
                      return
                  }
                  if (s == lastDockServer) {
                      if (localDirty) pushDock()
                      if ((wasErr || !dockShown) && (screen == "main" || screen == "home")) refreshTab()
                      dockShown = true
                      return
                  }
                  if (localDirty && lastDockServer.isNotEmpty()) { pushDock(); return }   // 내 변경 우선
                  try {
                      applyJson(JSONObject(s), withHistory = true)
                      mergeGaps(left); mergeGaps(right)
                      lastDockServer = s
                      lastDockLocal = stateJson().toString()
                      saveLocal()
                      dockShown = true
                      refreshTab()
                  } catch (e: Exception) { dockErr = "데이터 오류" }
              }

              private fun pushDock() {
                  if (!Fb.enabled || !dockReady) return
                  if (dockPushing) { dockAgain = true; return }
                  val st = stateJson().toString()
                  if (st == lastDockLocal && srvDock.optString("s", "") == lastDockServer && lastDockServer.isNotEmpty()) return
                  dockPushing = true
                  val body = JSONObject().put("dock", JSONObject().put("s", st).put("by", Fb.userName(this)).put("t", now()))
                  Thread {
                      var err = ""
                      try { Fb.patchRoot(body) } catch (e: Exception) { err = e.message ?: "오류" }
                      runOnUiThread {
                          dockPushing = false
                          if (err.isEmpty()) { lastDockServer = st; lastDockLocal = st; dockErr = ""; saveLocal() }
                          else { dockErr = err; handler.postDelayed({ scheduleDockPush() }, 5000) }
                          refreshTab()
                          if (dockAgain) { dockAgain = false; scheduleDockPush() }
                      }
                  }.start()
              }

              private fun askName() {
                  if (Fb.userName(this).isNotBlank()) return
                  val e = EditText(this).apply { hint = "이름 (예: 윤나경)"; inputType = InputType.TYPE_CLASS_TEXT }
                  val d = AlertDialog.Builder(this).setTitle("사용자 이름")
                      .setMessage("입출고 기록에 누가 했는지 남아요. 처음 한 번만 입력하세요.")
                      .setView(e).setCancelable(false).setPositiveButton("확인", null).show()
                  d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                      val n = e.text.toString().trim()
                      if (n.isEmpty()) toast("이름을 입력하세요")
                      else { getSharedPreferences("rack", MODE_PRIVATE).edit().putString("user", n).apply(); d.dismiss(); refreshTab() }
                  }
              }

              private fun load() {
                  val pr = getSharedPreferences("a2dock", MODE_PRIVATE)
                  lastDockServer = pr.getString("srv", "") ?: ""
                  lastDockLocal = pr.getString("loc", "") ?: ""
                  val s = pr.getString("s", null) ?: return
                  try { applyJson(JSONObject(s), withHistory = true) } catch (e: Exception) { }
              }
          }

                          isClickable = true
                          setOnClickListener { if (!on) onTab(key) }
                      }
                      addView(item, LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(dp(c, 3), 0, dp(c, 3), 0) })
                  }

              private fun importXlsx(uri: Uri) {
                  try {
                      val rows = contentResolver.openInputStream(uri)?.use { XlsxRead.read(it) } ?: emptyList()
                      val hIdx = rows.indexOfFirst { r -> r.values.any { it.uppercase().contains("LOT") } }
                      if (hIdx < 0) { toast("LOT 칸을 못 찾았어요"); return }
                      val h = rows[hIdx]
                      val h2 = rows.getOrNull(hIdx + 1) ?: emptyMap()
                      fun colOf(vararg keys: String): Int? {
                          for ((c, v) in h.entries.sortedBy { it.key }) if (keys.any { k -> v.uppercase().replace(" ", "").contains(k) }) return c
                          return null
                      }
                      val cLot = colOf("LOT") ?: return
                      val cBl = colOf("BL", "B/L")
                      val cName = colOf("품명", "품목", "ITEM")
                      val cM = colOf("미터", "(M)", "수량")
                      val cStock = h.entries.sortedBy { it.key }.firstOrNull { it.value.replace(" ", "").trim() == "재고" }?.key
                      var cDate = h2.entries.sortedBy { it.key }.firstOrNull { it.value.contains("일자") }?.key
                      if (cDate == null) cDate = colOf("입고일", "입고", "일자")
                      val out = ArrayList<RRef>()
                      val gone = HashSet<String>()   // 재고 0 이하 = 이미 출고된 줄
                      for (r in rows.drop(hIdx + 1)) {
                          val lot = (r[cLot] ?: "").trim().uppercase()
                          if (lot.length < 4 || lot.contains("LOT")) continue
                          val left = cStock?.let { r[it] }?.trim()?.toDoubleOrNull()
                          if (left != null && left <= 0.0) { gone.add(lot); continue }
                          out.add(RRef(lot, cName?.let { r[it] } ?: "", cM?.let { r[it] }?.let { if (it.isNotBlank()) "$it M" else "" } ?: "",
                              (cBl?.let { r[it] } ?: "").uppercase(), xlDate(cDate?.let { r[it] } ?: "")))
                      }
                      gone.removeAll(out.map { it.lot }.toSet())
                      applyRefs(out, gone)
                  } catch (e: Exception) { toast("엑셀 읽기 실패: ${e.message}") }
              }

              private fun xlDate(v: String): String {
                  val s = v.trim()
                  if (s.isEmpty()) return ""
                  Regex("20\\d\\d[-./]\\d{1,2}[-./]\\d{1,2}").find(s)?.let { return Labels.fixDate(it.value) }
                  val d = s.toDoubleOrNull() ?: return s
                  if (d < 30000 || d > 80000) return s
                  val c = Calendar.getInstance(); c.clear(); c.set(1899, Calendar.DECEMBER, 30); c.add(Calendar.DAY_OF_MONTH, d.toInt())
                  return SimpleDateFormat("yyyy-MM-dd", Locale.KOREA).format(c.time)
              }


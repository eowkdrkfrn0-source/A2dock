          cat > 'app/src/main/java/com/nakyung/a2dock/Gate.kt' <<'TALLY_EOF'
          package com.nakyung.a2dock

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import java.io.File

          /**
           * 인터넷 필수 + 강제 업데이트.
           * - 인터넷이 끊기면 바로 "인터넷 연결 필요" 창 (다시 시도 / 종료)
           * - 새 버전이 있으면 "업데이트 필요" 창 (업데이트 / 종료) → 업데이트 안 하면 못 씀
           */
          object Gate {
              private val main = Handler(Looper.getMainLooper())
              private var act: Activity? = null
              private var offDlg: AlertDialog? = null
              private var upDlg: AlertDialog? = null
              private var cb: ConnectivityManager.NetworkCallback? = null
              private var lastCheck = 0L
              private var checking = false
              private var downloading = false
              private var release: Release? = null
              private var pendingApk: File? = null

              fun resume(a: Activity) {
                  act = a
                  if (cb == null) {
                      try {
                          val cm = a.applicationContext.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          val c = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) { main.postDelayed({ act?.let { eval(it) } }, 300) }
                              override fun onLost(network: Network) { main.postDelayed({ act?.let { eval(it) } }, 800) }
                          }
                          cm.registerDefaultNetworkCallback(c)
                          cb = c
                      } catch (e: Exception) { }
                  }
                  val p = pendingApk
                  if (p != null && (Build.VERSION.SDK_INT < 26 || a.packageManager.canRequestPackageInstalls())) {
                      pendingApk = null; install(a, p); return
                  }
                  eval(a)
              }

              fun pause(a: Activity) { if (act === a) act = null }

              fun online(c: Context): Boolean {
                  return try {
                      val cm = c.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val n = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(n) ?: return false
                      caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } catch (e: Exception) { true }
              }

              private fun eval(a: Activity) {
                  if (a.isFinishing || downloading) return
                  if (!online(a)) { showOffline(a); return }
                  offDlg?.let { if (it.isShowing) try { it.dismiss() } catch (e: Exception) { } }
                  offDlg = null
                  val r = release
                  if (r != null && r.build > BuildInfo.BUILD) { showUpdate(a, r); return }
                  if (System.currentTimeMillis() - lastCheck > 3 * 60 * 1000L) check(false)
              }

              /** 업데이트 확인 (manual = 결과를 토스트로 알림) */
              fun check(manual: Boolean) {
                  if (checking) return
                  checking = true
                  Thread {
                      var r: Release? = null
                      var err: String? = null
                      try { r = Updater.latest(BuildInfo.REPO, "") } catch (e: Exception) { err = e.message ?: "오류" }
                      val rr = r
                      val ee = err
                      main.post {
                          checking = false
                          if (ee == null) lastCheck = System.currentTimeMillis()
                          if (rr != null) release = rr
                          val cur = act
                          if (cur != null) {
                              if (rr != null && rr.build > BuildInfo.BUILD) showUpdate(cur, rr)
                              else if (manual) Toast.makeText(cur, if (ee != null) "업데이트 확인 실패: $ee" else "최신 버전입니다 (${BuildInfo.BUILD})", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.start()
              }

              private fun showOffline(a: Activity) {
                  val d = offDlg
                  if (d != null && d.isShowing && d.ownerActivity === a) return
                  try { d?.dismiss() } catch (e: Exception) { }
                  offDlg = AlertDialog.Builder(a).setTitle("인터넷 연결 필요")
                      .setMessage("인터넷이 연결되어 있어야 사용할 수 있어요.\n와이파이나 데이터를 켜주세요.\n(작업한 기록은 그대로 저장되어 있어요)")
                      .setCancelable(false)
                      .setPositiveButton("다시 시도") { _, _ -> offDlg = null; main.postDelayed({ act?.let { eval(it) } }, 300) }
                      .setNegativeButton("종료") { _, _ -> a.finishAffinity() }
                      .create().also { it.setOwnerActivity(a); it.show() }
              }

              private fun showUpdate(a: Activity, r: Release) {
                  if (downloading) return
                  val d = upDlg
                  if (d != null && d.isShowing && d.ownerActivity === a) return
                  try { d?.dismiss() } catch (e: Exception) { }
                  upDlg = AlertDialog.Builder(a).setTitle("업데이트 필요")
                      .setMessage("새 버전 ${r.build}이(가) 나왔어요.\n업데이트해야 계속 쓸 수 있어요.\n(지금 버전 ${BuildInfo.BUILD})")
                      .setCancelable(false)
                      .setPositiveButton("업데이트") { _, _ -> upDlg = null; download(a, r) }
                      .setNegativeButton("종료") { _, _ -> a.finishAffinity() }
                      .create().also { it.setOwnerActivity(a); it.show() }
              }

              private fun download(a: Activity, r: Release) {
                  downloading = true
                  val dlg = AlertDialog.Builder(a).setTitle("업데이트 받는 중").setMessage("0%").setCancelable(false).show()
                  Thread {
                      try {
                          val f = File(File(a.cacheDir, "apk"), "A2Dock-${r.build}.apk")
                          Updater.download(r, "", f) { p -> main.post { dlg.setMessage("$p%") } }
                          main.post {
                              downloading = false
                              try { dlg.dismiss() } catch (e: Exception) { }
                              install(act ?: a, f)
                          }
                      } catch (e: Exception) {
                          main.post {
                              downloading = false
                              try { dlg.dismiss() } catch (x: Exception) { }
                              Toast.makeText(a, "다운로드 실패: ${e.message}", Toast.LENGTH_LONG).show()
                              act?.let { showUpdate(it, r) }
                          }
                      }
                  }.start()
              }

              private fun install(a: Activity, f: File) {
                  if (Build.VERSION.SDK_INT >= 26 && !a.packageManager.canRequestPackageInstalls()) {
                      pendingApk = f
                      Toast.makeText(a, "'이 출처 허용'을 켜고 돌아오면 설치가 시작돼요", Toast.LENGTH_LONG).show()
                      a.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${a.packageName}")))
                      return
                  }
                  val uri = FileProvider.getUriForFile(a, "com.nakyung.a2dock.files", f)
                  a.startActivity(Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  })
              }
